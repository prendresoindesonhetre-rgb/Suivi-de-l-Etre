.cal-cell.cal-select { box-shadow: inset 0 0 0 2px var(--teal); border-radius: 6px; }
.cal-dots { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; min-height: 6px; }
.cal-dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
.cal-legend { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--doux); }
.cal-legend span { display: flex; align-items: center; gap: 5px; }
.leg-dot { width: 10px; height: 10px; border-radius: 3px; }
.cal-jour { margin-top: 14px; }

.champ { display: block; font-size: 12px; font-weight: 700; color: var(--violet-fonce); margin-bottom: 8px; }

.pour { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 6px; }
.pour label { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--bord-md); border-radius: var(--rayon); padding: 9px 10px; cursor: pointer; font-size: 13.5px; }
.modale .pour input { width: 18px; height: 18px; padding: 0; margin: 2px 0 0; flex-shrink: 0; accent-color: var(--violet); }
.pour label span { flex: 1; }
.pour small { display: block; font-size: 11.5px; color: var(--doux); font-weight: 400; }
.erreur { color: #c05070; font-size: 12.5px; font-weight: 700; margin-top: 4px; }
.cal-vide { text-align: center; padding: 1.5rem 1rem; color: var(--doux); font-size: 13px; }
.cal-vide div { font-size: 32px; margin-bottom: 6px; }
.fond-modale { position: fixed; inset: 0; background: rgba(74,58,106,0.35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.modale { background: var(--carte); border-radius: 14px; width: 340px; max-width: 100%; padding: 18px; box-shadow: 0 8px 30px rgba(74,58,106,0.25); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; display: block; margin: 0; }
.modale h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; margin: 0 0 4px; color: var(--violet-fonce); }
.modale p { font-size: 13px; color: var(--doux); margin: 0 0 10px; }
.modale input { width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid var(--bord-md); border-radius: var(--rayon); font-family: inherit; }
.modale .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.modale .actions .annuler { background: #fff; }
</style>

<div class="page">
  <h1 id="titre">🛒 Nos courses</h1>
  <div class="onglets" id="onglets" hidden><button type="button" data-onglet="courses">🛒 Courses</button><button type="button" data-onglet="agenda">📅 Agenda</button></div>
  <div class="etat" id="etat"></div>
  <div id="contenu"></div>
  <div id="agenda" hidden></div>
</div>
<script>
'use strict';
// Page « Nos courses » : les listes de courses partagées depuis Suivi de l'Être
// et l'agenda, rien d'autre. On y entre avec la clé du lien (?l=…), gardée ensuite sur
// l'appareil. Les modifications en attente restent ici tant qu'elles ne sont
// pas arrivées au serveur : rien ne se perd hors connexion.
const SB_URL = 'https://issedanlnadbhidlymnc.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlzc2VkYW5sbmFkYmhpZGx5bW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTAzNjUsImV4cCI6MjA5Njc2NjM2NX0.vTpXYfaMOt1BUAXKgQdq0rWP4AMLMPdnux41SLeSXF4';

const lire = (k, defaut) => { try { const v = localStorage.getItem(k); return v === null ? defaut : JSON.parse(v); } catch (e) { return defaut; } };
const ecrire = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let cle = new URLSearchParams(location.search).get('l') || lire('nc_cle', '');
if (cle) ecrire('nc_cle', cle);
let doc = lire('nc_liste', []);
let listeCur = lire('nc_liste_cur', ''), habGerer = false;
let agenda = lire('nc_agenda', null), agendaMaj = lire('nc_agenda_maj', '');
let onglet = lire('nc_onglet', 'courses');
let etat = '', majLe = 0;

function escHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function newId() { return Date.now() + Math.floor(Math.random() * 1000); }

// Mêmes règles que dans l'appli (index.html) : à garder en phase.
function decouperCourses(saisie) {
  const morceaux = [];
  let courant = '';
  for (let i = 0; i < saisie.length; i++) {
    const ch = saisie[i];
    if ((ch === ',' || ch === '.') && !(/\d/.test(saisie[i - 1] || '') && /\d/.test(saisie[i + 1] || ''))) { morceaux.push(courant); courant = ''; }
    else courant += ch;
  }
  morceaux.push(courant);
  return morceaux.map(s => s.trim()).filter(Boolean);
}
function separerQuantite(texte) {
  const m = texte.match(/^(\d+(?:[.,]\d+)?)\s*(kg|mg|g|cl|ml|dl|l|x|×|paquets?|boîtes?|boites?|bouteilles?|sachets?|pots?|packs?|tranches?|barquettes?|briques?|douzaines?|bottes?|filets?|rouleaux|rouleau|pièces?|pieces?)?\s+(?:de\s+|d['’]\s*)?(.+)$/i);
  if (!m || !m[3].trim()) return { texte, qte: '' };
  let unite = m[2] || '';
  if (/^[x×]$/i.test(unite)) unite = '';
  if (unite === 'l') unite = 'L';
  return { texte: m[3].trim(), qte: unite ? `${m[1]} ${unite}` : m[1] };
}
// ─── Modèle des listes de courses (identique dans index.html et courses/) ───
// Un « document » est une suite d'entrées : les listes { k:'liste', id, nom },
// les articles { id, liste, texte, qte, fait } et les habituels
// { k:'hab', liste, cle, texte, qte, n, epingle, vu } (appris à chaque ajout).
// Chaque modification est une opération rejouable sur la version du serveur.
const LISTE_PRINCIPALE = 'principale';
const cleHab = t => String(t || '').trim().toLowerCase();
const listeDeArticle = a => a.liste || LISTE_PRINCIPALE;
function listesDoc(doc) {
  const listes = (doc || []).filter(e => e.k === 'liste');
  if (!listes.some(l => l.id === LISTE_PRINCIPALE) && (doc || []).some(e => !e.k && listeDeArticle(e) === LISTE_PRINCIPALE)) listes.push({ k: 'liste', id: LISTE_PRINCIPALE, nom: 'Courses' });
  return listes.sort((a, b) => (a.id === LISTE_PRINCIPALE ? -1 : b.id === LISTE_PRINCIPALE ? 1 : String(a.id).localeCompare(String(b.id))));
}
function articlesDoc(doc, listeId) { return (doc || []).filter(e => !e.k && listeDeArticle(e) === listeId); }
// Tout ce qui appartient à une liste (pour la déplacer d'un document à l'autre).
function entreesListe(doc, listeId) {
  const meta = listesDoc(doc).find(l => l.id === listeId) || { k: 'liste', id: listeId, nom: 'Courses' };
  return [{ ...meta }, ...articlesDoc(doc, listeId).map(a => ({ ...a, liste: listeId })), ...(doc || []).filter(e => e.k === 'hab' && e.liste === listeId).map(h => ({ ...h }))];
}
function appliquerOpCourses(doc, op) {
  doc = (doc || []).map(e => ({ ...e }));
  const meme = (a, id) => !a.k && String(a.id) === String(id);
  const hab = (liste, texte) => doc.find(e => e.k === 'hab' && e.liste === liste && e.cle === cleHab(texte));
  const dansListe = (e, id) => (e.k === 'liste' && e.id === id) || (e.k === 'hab' && e.liste === id) || (!e.k && listeDeArticle(e) === id);
  if (op.t === 'ajout') (op.articles || []).forEach(n => {
    if (doc.some(a => meme(a, n.id))) return;
    doc.push({ ...n });
    const liste = listeDeArticle(n), h = hab(liste, n.texte);
    if (h) { h.n = (h.n || 0) + 1; h.texte = n.texte; if (n.qte) h.qte = n.qte; h.vu = n.id; }
    else doc.push({ k: 'hab', liste, cle: cleHab(n.texte), texte: n.texte, qte: n.qte || '', n: 1, vu: n.id });
    // On garde les 40 habituels les plus utiles par liste (les épinglés en plus).
    const habs = doc.filter(e => e.k === 'hab' && e.liste === liste && !e.epingle).sort((a, b) => (b.n || 0) - (a.n || 0) || (b.vu || 0) - (a.vu || 0));
    if (habs.length > 40) { const trop = new Set(habs.slice(40)); doc = doc.filter(e => !trop.has(e)); }
  });
  else if (op.t === 'cocher') doc.forEach(a => { if (meme(a, op.id)) a.fait = !!op.fait; });
  else if (op.t === 'qte') doc.forEach(a => { if (meme(a, op.id)) a.qte = op.qte || ''; });
  else if (op.t === 'retirer') doc = doc.filter(a => !(op.ids || []).some(id => meme(a, id)));
  else if (op.t === 'liste') { const l = doc.find(e => e.k === 'liste' && e.id === op.id); if (l) l.nom = op.nom; else doc.push({ k: 'liste', id: op.id, nom: op.nom }); }
  else if (op.t === 'supprListe') doc = doc.filter(e => !dansListe(e, op.id));
  else if (op.t === 'epingle') {
    const h = hab(op.liste, op.texte);
    if (h) h.epingle = !!op.oui;
    else if (op.oui) doc.push({ k: 'hab', liste: op.liste, cle: cleHab(op.texte), texte: op.texte, qte: op.qte || '', n: 0, epingle: true, vu: 0 });
  }
  else if (op.t === 'oublier') doc = doc.filter(e => !(e.k === 'hab' && e.liste === op.liste && e.cle === op.cle));
  // Agenda partagé : les événements ajoutés depuis la page { k:'ev', id, d, h, f, t, l, pour }.
  else if (op.t === 'ev') { doc = doc.filter(e => !(e.k === 'ev' && (String(e.id) === String(op.ev.id) || (op.purge && e.d < op.purge)))); doc.push({ ...op.ev, k: 'ev' }); }
  else if (op.t === 'supprEv') doc = doc.filter(e => !(e.k === 'ev' && String(e.id) === String(op.id)));
  else if (op.t === 'importer') (op.entrees || []).forEach(n => {
    if (n.k === 'liste') { const l = doc.find(e => e.k === 'liste' && e.id === n.id); if (l) l.nom = n.nom; else doc.push({ ...n }); }
    else if (n.k === 'hab') { const h = hab(n.liste, n.texte); if (h) Object.assign(h, n); else doc.push({ ...n }); }
    else if (!n.k && !doc.some(a => meme(a, n.id))) doc.push({ ...n });
  });
  return doc;
}
// Les habituels proposés : épinglés et souvent ajoutés ; pendant la saisie,
// ceux qui ressemblent à ce qu'on tape. Pas ceux déjà à prendre dans la liste.
function habituelsDoc(doc, listeId, saisie) {
  const enCours = new Set(articlesDoc(doc, listeId).filter(a => !a.fait).map(a => cleHab(a.texte)));
  let habs = (doc || []).filter(e => e.k === 'hab' && e.liste === listeId && !enCours.has(e.cle));
  const morceaux = decouperCourses(saisie || '');
  const q = /[,.]\s*$/.test(saisie || '') || !morceaux.length ? '' : cleHab(separerQuantite(morceaux[morceaux.length - 1]).texte);
  habs = q ? habs.filter(h => h.cle.includes(q)) : habs.filter(h => h.epingle || (h.n || 0) >= 2);
  return habs.sort((a, b) => (b.epingle ? 1 : 0) - (a.epingle ? 1 : 0) || (b.n || 0) - (a.n || 0) || (b.vu || 0) - (a.vu || 0)).slice(0, q ? 8 : 15);
}
// Après avoir touché une suggestion : on retire de la saisie le mot commencé.
function saisieSansDernier(saisie) {
  const m = decouperCourses(saisie || '');
  if (/[,.]\s*$/.test(saisie || '') || !m.length) return saisie || '';
  m.pop();
  return m.length ? m.join(', ') + ', ' : '';
}

async function rpc(fn, args) {
  const res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  if (!res.ok) throw new Error('rpc ' + res.status);
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

let enCours = null, encore = false;
function synchroniser() {
  if (!cle) return Promise.resolve();
  if (enCours) { encore = true; return enCours; }
  enCours = (async () => {
    try {
      let r = await rpc('courses_lire', { p_cle: cle });
      if (r && 'agenda' in r) { agenda = r.agenda; agendaMaj = r.agenda_maj || ''; ecrire('nc_agenda', agenda); ecrire('nc_agenda_maj', agendaMaj); }
      for (let essai = 0; r && essai < 5; essai++) {
        const attente = lire('nc_attente', []);
        if (!attente.length) break;
        const w = await rpc('courses_ecrire', { p_cle: cle, p_articles: attente.reduce(appliquerOpCourses, r.articles || []), p_version: r.version });
        if (w && w.ok) ecrire('nc_attente', lire('nc_attente', []).slice(attente.length));
        r = w;
      }
      if (!r) { etat = 'invalide'; }
      else {
        etat = 'ok'; majLe = Date.now();
        doc = lire('nc_attente', []).reduce(appliquerOpCourses, r.articles || []);
        ecrire('nc_liste', doc);
      }
    } catch (e) { etat = 'horsligne'; }
    enCours = null;
    afficher();
    if (encore) { encore = false; synchroniser(); }
  })();
  return enCours;
}
function operation(op) {
  doc = appliquerOpCourses(doc, op);
  ecrire('nc_liste', doc);
  ecrire('nc_attente', [...lire('nc_attente', []), op]);
  afficher();
  synchroniser();
}
function listeCourante() { const ls = listesDoc(doc); return ls.find(l => l.id === listeCur) || ls[0] || null; }
function choisirListe(id) { listeCur = id; ecrire('nc_liste_cur', id); habGerer = false; afficher(); }
function nouvelId(deja) { let id = newId(); while (doc.some(x => x.id === id) || deja.some(x => x.id === id)) id++; return id; }

// Petites fenêtres : une question (texte à saisir) ou un choix de boutons.
function fenetre(html, brancher) {
  return new Promise(resolve => {
    const fond = document.createElement('div');
    fond.className = 'fond-modale';
    fond.innerHTML = `<form class="modale">${html}</form>`;
    document.body.appendChild(fond);
    const fin = v => { fond.remove(); resolve(v); };
    fond.onclick = e => { if (e.target === fond) fin(null); };
    fond.querySelectorAll('[data-annuler]').forEach(b => b.onclick = () => fin(null));
    brancher(fond, fin);
  });
}
function demander(titre, texte, valeur, ok) {
  return fenetre(`<h2>${escHtml(titre)}</h2><p>${escHtml(texte)}</p><input type="text" autocomplete="off" value="${escHtml(valeur || '')}">
    <div class="actions"><button type="button" class="btn annuler" data-annuler>Annuler</button><button type="submit" class="btn">${escHtml(ok || 'OK')}</button></div>`,
    (fond, fin) => { const champ = fond.querySelector('input'); fond.querySelector('form').onsubmit = e => { e.preventDefault(); fin(champ.value); }; champ.focus(); champ.select(); });
}
function choisir(titre, texte, choix) {
  return fenetre(`<h2>${escHtml(titre)}</h2>${texte ? `<p>${escHtml(texte)}</p>` : ''}<div style="display:flex;flex-direction:column;gap:8px">${choix.map(c => `<button type="button" class="btn" data-choix="${escHtml(c.cle)}" style="${c.danger ? 'background:#fff;color:#c05070;border-color:#e8b4c4' : ''}">${escHtml(c.label)}</button>`).join('')}
    <button type="button" class="btn annuler" data-annuler>Annuler</button></div>`,
    (fond, fin) => fond.querySelectorAll('[data-choix]').forEach(b => b.onclick = () => fin(b.dataset.choix)));
}

function ajouter() {
  const champ = document.getElementById('ajout');
  const saisies = decouperCourses(champ.value || '');
  const l = listeCourante();
  if (!saisies.length || !l) return;
  const nouveaux = [];
  saisies.forEach(s => {
    const { texte, qte } = separerQuantite(s);
    nouveaux.push({ id: nouvelId(nouveaux), liste: l.id, texte, qte, fait: false });
  });
  champ.value = '';
  operation({ t: 'ajout', articles: nouveaux });
  document.getElementById('ajout')?.focus();
}
const article = id => doc.find(x => !x.k && String(x.id) === String(id));
function basculer(id) { const a = article(id); if (a) operation({ t: 'cocher', id: a.id, fait: !a.fait }); }
function retirer(id) { operation({ t: 'retirer', ids: [id] }); }
function viderCoches() { const l = listeCourante(); const ids = l ? articlesDoc(doc, l.id).filter(x => x.fait).map(x => x.id) : []; if (ids.length) operation({ t: 'retirer', ids }); }
async function changerQuantite(id) {
  const a = article(id);
  if (!a) return;
  const v = await demander('Quantité', `Pour « ${a.texte} » (ex. : 2, 500 g, 1 kg). Laissez vide pour l'enlever.`, a.qte || '');
  if (v !== null) operation({ t: 'qte', id: a.id, qte: v.trim() });
}
function epingler(id) {
  const a = article(id);
  if (!a) return;
  const l = listeDeArticle(a), h = doc.find(e => e.k === 'hab' && e.liste === l && e.cle === cleHab(a.texte));
  operation({ t: 'epingle', liste: l, texte: a.texte, qte: a.qte || '', oui: !h?.epingle });
}
function ajouterHabituel(c) {
  const l = listeCourante(), h = l && doc.find(e => e.k === 'hab' && e.liste === l.id && e.cle === c);
  if (!h) return;
  const champ = document.getElementById('ajout');
  if (champ) champ.value = saisieSansDernier(champ.value);
  operation({ t: 'ajout', articles: [{ id: nouvelId([]), liste: l.id, texte: h.texte, qte: h.qte || '', fait: false }] });
}
async function nouvelleListe() {
  const nom = ((await demander('Nouvelle liste', 'Nom de la liste (ex. : Marché, Pharmacie, Bricolage) :', '', 'Créer')) || '').trim();
  if (!nom) return;
  const id = 'l' + newId();
  operation({ t: 'liste', id, nom });
  choisirListe(id);
}
async function menuListe() {
  const l = listeCourante();
  if (!l) return;
  const c = await choisir(l.nom, '', [{ cle: 'renommer', label: '✏️ Renommer' }, { cle: 'supprimer', label: '🗑️ Supprimer la liste', danger: true }]);
  if (c === 'renommer') {
    const nom = ((await demander('Renommer la liste', 'Nouveau nom :', l.nom)) || '').trim();
    if (nom) operation({ t: 'liste', id: l.id, nom });
  } else if (c === 'supprimer') {
    if ((await choisir('Supprimer la liste', `La liste « ${l.nom} » et ses articles seront supprimés, chez vous deux.`, [{ cle: 'oui', label: 'Supprimer', danger: true }])) !== 'oui') return;
    operation({ t: 'supprListe', id: l.id });
  }
}

function ligneHtml(a, epingles) {
  const qte = a.qte ? `<button type="button" class="qte" data-qte="${a.id}">${escHtml(a.qte)}</button>`
    : a.fait ? '' : `<button type="button" class="qte vide" data-qte="${a.id}">+ qté</button>`;
  const ep = epingles.has(cleHab(a.texte));
  return `<div class="ligne${a.fait ? ' pris' : ''}">
    <input type="checkbox" ${a.fait ? 'checked' : ''} data-cocher="${a.id}" aria-label="Pris">
    ${qte}<span class="texte" data-cocher="${a.id}">${escHtml(a.texte)}</span>
    <button type="button" class="etoile${ep ? ' on' : ''}" data-epingle="${a.id}" aria-label="${ep ? 'Désépingler' : 'Épingler dans les habituels'}">${ep ? '⭐' : '☆'}</button>
    <button type="button" class="retirer" data-retirer="${a.id}" aria-label="Retirer">×</button></div>`;
}
function afficherHabituels() {
  const el = document.getElementById('habituels'), l = listeCourante();
  if (!el) return;
  if (!l) { el.innerHTML = ''; return; }
  const saisie = document.getElementById('ajout')?.value || '';
  const enSaisie = !habGerer && decouperCourses(saisie).length > 0 && !/[,.]\s*$/.test(saisie);
  const habs = habituelsDoc(doc, l.id, habGerer ? '' : saisie);
  if (!habs.length && !habGerer) { el.innerHTML = ''; return; }
  const chip = h => habGerer
    ? `<span class="puce gerer"><button type="button" data-hab-epingle="${escHtml(h.cle)}" aria-label="${h.epingle ? 'Désépingler' : 'Épingler'}">${h.epingle ? '⭐' : '☆'}</button>${h.qte ? escHtml(h.qte) + ' ' : ''}${escHtml(h.texte)}<button type="button" data-hab-oublier="${escHtml(h.cle)}" aria-label="Retirer des habituels">×</button></span>`
    : `<button type="button" class="puce" data-hab="${escHtml(h.cle)}">${h.epingle ? '⭐ ' : '+ '}${h.qte ? escHtml(h.qte) + ' ' : ''}${escHtml(h.texte)}</button>`;
  el.innerHTML = `<div class="hab-titre"><span>${enSaisie ? 'Suggestions' : '⭐ Habituels'}</span>${enSaisie ? '' : `<button type="button" class="btn" data-hab-gerer>${habGerer ? 'Terminé' : 'Gérer'}</button>`}</div>
    <div class="puces">${habs.map(chip).join('') || '<span class="aide">Rien pour le moment : les articles ajoutés souvent apparaîtront ici. ☆ sur un article pour l\'épingler.</span>'}</div>`;
}

// ─── Agenda : le même calendrier que dans l'appli (grille du mois, pastilles,
// fériés, vacances scolaires) ; on touche un jour pour voir son détail dessous.
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const MOIS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
const ceMois = () => { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; };
let calY = ceMois().y, calM = ceMois().m, jourChoisi = '';
const filtreAgenda = k => lire('nc_voir_' + k, true);
// Fin affichée comme dans l'appli : « → 10h00 ».
const finLisible = f => f ? f.replace(':', 'h') : '';
function rdvsDuJour(s) {
  return (agenda || []).filter(x => !x.k && x.d === s && filtreAgenda(x.p ? 'perso' : 'pro'));
}
// Ce qu'elle a ajouté : « Pour nous deux » ou « Pour moi », modifiable ici seulement.
function evsDuJour(s) { return filtreAgenda('commun') ? doc.filter(e => e.k === 'ev' && e.d === s) : []; }
async function editerEvenement(id, jour) {
  const ev = id ? doc.find(e => e.k === 'ev' && String(e.id) === String(id)) : null;
  const v = ev || { d: jour || iso(new Date()), h: '', f: '', t: '', l: '', pour: 'nous' };
  const r = await fenetre(`<h2>${ev ? 'Modifier' : 'Ajouter à l’agenda'}</h2>
      <label class="champ">Quoi ?<input type="text" name="t" value="${escHtml(v.t)}" placeholder="Ex. : Dîner chez mes parents" autocomplete="off"></label>
      <label class="champ">Date<input type="date" name="d" value="${escHtml(v.d)}"></label>
      <div style="display:flex;gap:8px"><label class="champ" style="flex:1">Début<input type="time" name="h" value="${escHtml(v.h)}"></label><label class="champ" style="flex:1">Fin<input type="time" name="f" value="${escHtml(v.f)}"></label></div>
      <label class="champ">Lieu <span style="font-weight:400;color:var(--discret)">(facultatif)</span><input type="text" name="l" value="${escHtml(v.l)}" autocomplete="off"></label>
      <div class="pour">
        <label><input type="radio" name="pour" value="nous" ${v.pour !== 'moi' ? 'checked' : ''}> <span><b>👥 Pour nous deux</b><small>Apparaît dans son agenda et bloque son temps</small></span></label>
        <label><input type="radio" name="pour" value="moi" ${v.pour === 'moi' ? 'checked' : ''}> <span><b>🙋 Pour moi</b><small>Pour info : ne bloque pas son temps</small></span></label>
      </div>
      <div class="erreur" hidden></div>
      <div class="actions">${ev ? '<button type="button" class="btn annuler" data-suppr style="margin-right:auto;color:#c05070">Supprimer</button>' : ''}<button type="button" class="btn annuler" data-annuler>Annuler</button><button type="submit" class="btn">Enregistrer</button></div>`,
    (fond, fin) => {
      const f = fond.querySelector('form');
      fond.querySelector('[data-suppr]')?.addEventListener('click', () => fin('supprimer'));
      f.onsubmit = e => {
        e.preventDefault();
        const val = n => (f.elements[n].value || '').trim();
        const err = !val('t') ? 'Indiquez ce que c’est.' : !val('d') ? 'Choisissez la date.' : !val('h') ? 'Indiquez l’heure de début.' : val('f') && val('f') <= val('h') ? 'La fin doit être après le début.' : '';
        if (err) { const el = fond.querySelector('.erreur'); el.textContent = err; el.hidden = false; return; }
        fin({ t: val('t'), d: val('d'), h: val('h'), f: val('f'), l: val('l'), pour: f.elements.pour.value });
      };
      f.elements.t.focus();
    });
  if (!r) return;
  if (r === 'supprimer') {
    if ((await choisir('Supprimer', `« ${ev.t} » sera retiré de l'agenda, chez vous deux.`, [{ cle: 'oui', label: 'Supprimer', danger: true }])) === 'oui') operation({ t: 'supprEv', id: ev.id });
    return;
  }
  const purge = iso(new Date(Date.now() - 60 * 864e5));
  operation({ t: 'ev', ev: { id: ev ? ev.id : nouvelId([]), ...r }, purge });
  jourChoisi = r.d; calY = Number(r.d.slice(0, 4)); calM = Number(r.d.slice(5, 7)) - 1;
  afficher();
}
function afficherAgenda() {
  const el = document.getElementById('agenda');
  const auj = iso(new Date()), moisCle = `${calY}-${String(calM + 1).padStart(2, '0')}`;
  if (!jourChoisi || jourChoisi.slice(0, 7) !== moisCle) jourChoisi = auj.slice(0, 7) === moisCle ? auj : moisCle + '-01';
  const feries = new Set((agenda || []).filter(x => x.k === 'ferie').map(x => x.d));
  const vacances = (agenda || []).filter(x => x.k === 'vac');
  const vacanceDu = s => vacances.find(v => s >= v.d && s <= v.f);
  const premier = new Date(calY, calM, 1, 12), decalage = (premier.getDay() + 6) % 7;
  const nbJours = new Date(calY, calM + 1, 0).getDate(), avantNb = new Date(calY, calM, 0).getDate();
  const total = Math.ceil((decalage + nbJours) / 7) * 7;
  let cases = '';
  for (let i = 0; i < total; i++) {
    if (i < decalage || i >= decalage + nbJours) {
      const n = i < decalage ? avantNb - decalage + 1 + i : i - decalage - nbJours + 1;
      cases += `<div class="cal-cell other-month"><div class="cal-num">${n}</div><div class="cal-dots"></div></div>`;
      continue;
    }
    const j = i - decalage + 1, s = `${moisCle}-${String(j).padStart(2, '0')}`;
    const points = [...rdvsDuJour(s).map(x => x.p ? '#b8a8d0' : x.tr ? 'var(--amber)' : 'var(--teal)'), ...evsDuJour(s).map(e => e.pour === 'moi' ? '#b9d4ae' : '#7aaa6a')];
    const vac = vacanceDu(s);
    cases += `<div class="cal-cell${s === auj ? ' today' : ''}${feries.has(s) ? ' jour-ferie' : ''}${vac ? ' vacances-sco' : ''}${s === jourChoisi ? ' cal-select' : ''}" data-jour="${s}">
      ${vac ? '<div class="vacances-stripe"></div>' : ''}<div class="cal-num">${j}</div>
      <div class="cal-dots">${points.slice(0, 4).map(c => `<i style="background:${c}"></i>`).join('')}${points.length > 4 ? '<i style="background:var(--discret)"></i>' : ''}</div></div>`;
  }
  const cm = ceMois(), auPremierMois = calY < cm.y || (calY === cm.y && calM <= cm.m);
  const caseHtml = (k, l, coul, fond, coche, bord) => `<label style="color:${coul}"><input type="checkbox" class="case-cachee" data-voir="${k}" ${filtreAgenda(k) ? 'checked' : ''}><span class="case-coul" style="border-color:${bord};--coul:${fond};--coche:${coche}"><i class="ti ti-check"></i></span>${l}</label>`;
  // Le jour choisi, comme sous le calendrier de l'appli sur téléphone.
  const du = [...rdvsDuJour(jourChoisi), ...evsDuJour(jourChoisi)].sort((a, b) => (a.h || '').localeCompare(b.h || ''));
  const vacJ = vacanceDu(jourChoisi);
  const titreJour = new Date(jourChoisi + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const infos = (feries.has(jourChoisi) ? '<div class="cal-info" style="color:#c07000">Jour férié</div>' : '')
    + (vacJ ? `<div class="cal-info" style="color:#7a5ab8">Vacances scolaires${vacJ.t ? ' · ' + escHtml(vacJ.t) : ''}</div>` : '');
  el.innerHTML = `<div class="cal-nav">
      <button type="button" data-cal="prec" aria-label="Mois précédent" ${auPremierMois ? 'disabled' : ''}><i class="ti ti-chevron-left"></i></button>
      <span class="cal-month">${MOIS[calM]} ${calY}</span>
      <button type="button" data-cal="suiv" aria-label="Mois suivant"><i class="ti ti-chevron-right"></i></button>
    </div>
    ${agenda ? '' : `<div class="cal-info" style="color:var(--doux);font-weight:600">Son agenda n'est pas encore partagé : il apparaîtra dès la prochaine ouverture de l'appli.</div>`}
    <div class="agenda-cases">${caseHtml('pro', 'Pro', '#1a7a7a', '#1a7a7a', 'white', '#1a7a7a')}${caseHtml('perso', 'Perso', '#7a6a9a', '#e4daf2', '#4a3a6a', '#b8a8d0')}${caseHtml('commun', 'Commun', '#4f7a3e', '#dcebd5', '#2f5a22', '#9cc28c')}</div>
    <div class="cal-actions"><button type="button" data-cal="auj">Aujourd'hui</button><button type="button" data-cal="ajouter" class="ajouter"><i class="ti ti-plus"></i> Ajouter</button></div>
    <div class="cal-grid">
      <div class="cal-days-header">${['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map(n => `<div class="cal-day-name">${n}</div>`).join('')}</div>
      <div class="cal-days">${cases}</div>
    </div>
    <div class="cal-legend">
      <span><div class="leg-dot" style="background:var(--teal-light);border:1px solid var(--teal)"></div> Séance</span>
      <span><div class="leg-dot" style="background:#fdf0e6;border:1px solid var(--amber)"></div> Déplacement inclus</span>
      <span><div class="leg-dot" style="background:#f0eaf8;border:1px solid #b8a8d0"></div> Perso</span>
      <span><div class="leg-dot" style="background:#eef6ea;border:1px solid #7aaa6a"></div> Commun</span>
      <span><div class="leg-dot" style="background:rgba(255,165,50,0.5)"></div> Jour férié</span>
      <span><div class="leg-dot" style="background:rgba(160,110,240,0.35)"></div> Vac. scolaires (Aube)</span>
    </div>
    <div class="cal-jour">
      <div class="cal-jour-titre">${escHtml(titreJour)}</div>${infos}
      ${du.length ? du.map(x => `<div class="cal-rdv${x.k === 'ev' ? (x.pour === 'moi' ? ' commun info' : ' commun') : x.p ? ' perso' : ''}"${x.k === 'ev' ? ` data-ev="${escHtml(x.id)}"` : ''}>
          <div class="haut"><span class="debut">${escHtml(x.h)}</span>${x.f ? `<span class="fin">→ ${escHtml(finLisible(x.f))}</span>` : ''}<span class="quoi">${escHtml(x.t || 'Occupé')}</span>${x.k === 'ev' ? '<span class="modif">✏️</span>' : ''}</div>
          ${x.l ? `<div class="ou">📍 ${escHtml(x.l)}</div>` : ''}
          ${x.k === 'ev' ? `<div class="pour-qui">${x.pour === 'moi' ? '🙋 Pour moi' : '👥 Pour nous deux'}</div>` : ''}
        </div>`).join('') : '<div class="cal-vide"><div>🌿</div>Aucun rendez-vous</div>'}
    </div>`;
}
document.getElementById('agenda').addEventListener('click', e => {
  const b = e.target.closest('[data-cal]');
  if (b) {
    if (b.dataset.cal === 'prec') { calM--; if (calM < 0) { calM = 11; calY--; } }
    else if (b.dataset.cal === 'suiv') { calM++; if (calM > 11) { calM = 0; calY++; } }
    else if (b.dataset.cal === 'ajouter') { editerEvenement(null, jourChoisi); return; }
    else { const t = ceMois(); calY = t.y; calM = t.m; jourChoisi = iso(new Date()); }
    afficherAgenda();
    return;
  }
  const ev = e.target.closest('[data-ev]');
  if (ev) { editerEvenement(ev.dataset.ev); return; }
  const c = e.target.closest('[data-jour]');
  if (c) { jourChoisi = c.dataset.jour; afficherAgenda(); }
});
document.getElementById('agenda').addEventListener('change', e => {
  const c = e.target.closest('[data-voir]');
  if (c) { ecrire('nc_voir_' + c.dataset.voir, c.checked); afficherAgenda(); }
});

function afficher() {
  const etatEl = document.getElementById('etat');
  const contenu = document.getElementById('contenu');
  const ongletsEl = document.getElementById('onglets'), agendaEl = document.getElementById('agenda');
  if (!cle || etat === 'invalide') {
    ongletsEl.hidden = true; agendaEl.hidden = true; contenu.hidden = false;
    etatEl.textContent = '';
    contenu.innerHTML = `<div class="message"><div>🔗</div>${cle ? 'Ce lien ne marche plus.<br>Demandez le nouveau lien de la liste de courses.' : 'Ouvrez le lien de la liste de courses que vous avez reçu par message.'}</div>`;
    if (cle) { try { localStorage.removeItem('nc_cle'); } catch (e) {} }
    return;
  }
  ongletsEl.hidden = false;
  ongletsEl.querySelectorAll('button').forEach(b => b.classList.toggle('actif', b.dataset.onglet === onglet));
  document.getElementById('titre').textContent = onglet === 'agenda' ? '📅 Agenda' : '🛒 Nos courses';
  contenu.hidden = onglet === 'agenda'; agendaEl.hidden = onglet !== 'agenda';
  const heure = majLe ? new Date(majLe).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
  if (onglet === 'agenda') {
    const m = agendaMaj ? new Date(agendaMaj) : null;
    etatEl.textContent = etat === 'horsligne' ? 'Hors connexion · dernier agenda reçu' : m ? `Agenda mis à jour le ${m.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })} à ${m.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}` : '';
    afficherAgenda();
  } else {
    etatEl.textContent = etat === 'horsligne' ? 'Hors connexion · vos changements partiront dès le retour du réseau' : heure ? `À jour à ${heure}` : 'Mise à jour…';
  }
  if (!document.getElementById('ajout')) {
    const autonome = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    contenu.innerHTML = `${!autonome && !lire('nc_astuce_vue', false) ? `<div class="astuce" id="astuce"><span>📲</span><span>Astuce : ajoutez cette page à votre écran d'accueil (bouton Partager, puis « Sur l'écran d'accueil ») pour la retrouver comme une appli.</span><button type="button" id="astuce-fermer" aria-label="Fermer">×</button></div>` : ''}
      <div class="puces" id="listes"></div>
      <div id="zone-liste">
        <form id="form-ajout"><input type="text" id="ajout" placeholder="Ajouter… (ex. : 2 baguettes, lait)" autocomplete="off" enterkeyhint="done"><button type="submit" class="btn btn-plus" aria-label="Ajouter">+</button></form>
        <div class="aide">Plusieurs d'un coup en les séparant par des virgules ou des points · la quantité devant : « 2 baguettes », « 500 g farine ».</div>
        <div id="habituels"></div>
        <div id="liste"></div>
      </div>`;
    document.getElementById('form-ajout').onsubmit = e => { e.preventDefault(); ajouter(); };
    document.getElementById('ajout').addEventListener('input', afficherHabituels);
    document.getElementById('astuce-fermer')?.addEventListener('click', () => { ecrire('nc_astuce_vue', true); document.getElementById('astuce')?.remove(); });
  }
  const l = listeCourante();
  document.getElementById('listes').innerHTML = listesDoc(doc).map(x => {
    const n = articlesDoc(doc, x.id).filter(a => !a.fait).length;
    return `<button type="button" class="puce${l && x.id === l.id ? ' on' : ''}" ${l && x.id === l.id ? 'data-liste-menu' : `data-liste="${escHtml(x.id)}"`}>${escHtml(x.nom)}${n ? ` <span style="opacity:0.65">${n}</span>` : ''}${l && x.id === l.id ? ' ⋯' : ''}</button>`;
  }).join('') + `<button type="button" class="puce nouvelle" data-liste-nouvelle>+ Liste</button>`;
  document.getElementById('zone-liste').hidden = !l;
  if (!l) {
    document.getElementById('liste').innerHTML = '';
    if (!document.getElementById('aucune-liste')) document.getElementById('listes').insertAdjacentHTML('afterend', `<div class="vide-liste" id="aucune-liste"><div>🛒</div>Aucune liste partagée pour le moment.<br>Créez-en une avec « + Liste ».</div>`);
    return;
  }
  document.getElementById('aucune-liste')?.remove();
  afficherHabituels();
  const articles = articlesDoc(doc, l.id);
  const epingles = new Set(doc.filter(e => e.k === 'hab' && e.liste === l.id && e.epingle).map(e => e.cle));
  const aPrendre = articles.filter(x => !x.fait), pris = articles.filter(x => x.fait);
  document.getElementById('liste').innerHTML = (aPrendre.length ? aPrendre.map(a => ligneHtml(a, epingles)).join('')
      : `<div class="vide-liste"><div>🛒</div>${pris.length ? 'Tout est dans le panier !' : 'La liste est vide.'}</div>`)
    + (pris.length ? `<div class="panier"><span>Dans le panier (${pris.length})</span><button type="button" class="btn" data-vider>🧹 Effacer les cochés</button></div>${pris.map(a => ligneHtml(a, epingles)).join('')}` : '');
}

// Un seul écouteur pour toute la partie Courses (posé une fois).
document.getElementById('contenu').addEventListener('click', e => {
  const t = e.target.closest('[data-cocher],[data-qte],[data-retirer],[data-vider],[data-epingle],[data-hab],[data-hab-epingle],[data-hab-oublier],[data-hab-gerer],[data-liste],[data-liste-menu],[data-liste-nouvelle]');
  if (!t) return;
  const l = listeCourante();
  if (t.dataset.cocher) { if (t.tagName === 'INPUT') e.preventDefault(); basculer(t.dataset.cocher); }
  else if (t.dataset.qte) changerQuantite(t.dataset.qte);
  else if (t.dataset.retirer) retirer(t.dataset.retirer);
  else if (t.dataset.epingle) epingler(t.dataset.epingle);
  else if (t.hasAttribute('data-vider')) viderCoches();
  else if (t.dataset.hab) ajouterHabituel(t.dataset.hab);
  else if (t.dataset.habEpingle && l) { const h = doc.find(x => x.k === 'hab' && x.liste === l.id && x.cle === t.dataset.habEpingle); if (h) operation({ t: 'epingle', liste: l.id, texte: h.texte, qte: h.qte, oui: !h.epingle }); }
  else if (t.dataset.habOublier && l) operation({ t: 'oublier', liste: l.id, cle: t.dataset.habOublier });
  else if (t.hasAttribute('data-hab-gerer')) { habGerer = !habGerer; afficherHabituels(); }
  else if (t.dataset.liste) choisirListe(t.dataset.liste);
  else if (t.hasAttribute('data-liste-menu')) menuListe();
  else if (t.hasAttribute('data-liste-nouvelle')) nouvelleListe();
});
document.getElementById('onglets').addEventListener('click', e => {
  const b = e.target.closest('[data-onglet]');
  if (!b) return;
  onglet = b.dataset.onglet; ecrire('nc_onglet', onglet);
  afficher();
  window.scrollTo(0, 0);
});
afficher();
synchroniser();
// Ce que l'autre ajoute arrive tout seul : toutes les 15 s à l'écran, et au retour sur la page.
setInterval(() => { if (document.visibilityState === 'visible') synchroniser(); }, 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') synchroniser(); });
</script>
</body>
</html>
