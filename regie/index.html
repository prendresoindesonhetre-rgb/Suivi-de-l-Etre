/* ——— Piloter la séance à la souris ———
   Clic sur la roulette : active / arrête le mode souris. En mode souris, la
   roulette règle la vitesse du texte, clic gauche = étape précédente, clic
   droit = étape suivante. La barre du haut, celle du bas et les fenêtres
   gardent leurs clics normaux. */
let souris=false;
const vitesseTexte=()=>G&&G.vitesse!=null?G.vitesse:D.prefs.wpm;
const vitesseTxt=v=>v===0?'⏸ Arrêt':v<0?`◀ Marche arrière · ${-v} mots/min`:`${v} mots/min`;
function majSouris(){
  const b=$('#g-souris');if(!b)return;
  b.classList.toggle('cache',!souris);
  b.innerHTML=`${IC.souris}<span>Souris · ${D.prefs.autoTexte?vitesseTxt(vitesseTexte()):'défilement arrêté'}</span>`;
  const g=$('#guide');if(g)g.classList.toggle('mode-souris',souris);
}
function brancherSouris(){
  const g=$('#guide');if(!g)return;souris=false;majSouris();
  const libre=e=>e.target.closest('.g-haut,.g-bas,.voile,.menu-liste,.g-suggest,.col-outils');
  g.addEventListener('mousedown',e=>{
    if(e.button!==1)return;e.preventDefault();               // pas de défilement automatique du navigateur
    souris=!souris;majSouris();
    if(souris&&!D.prefs.sourisVue){D.prefs.sourisVue=true;sauverBientot();
      toast('Mode souris : roulette ↑ plus vite, ↓ moins vite · clic gauche : étape précédente · clic droit : étape suivante · clic roulette : arrêter')}
    else toast(souris?'Mode souris activé':'Mode souris arrêté');
  });
  let dernier=0;
  g.addEventListener('wheel',e=>{
    if(!souris||libre(e))return;e.preventDefault();
    const now=performance.now();if(now-dernier<120)return;dernier=now;
    // Un cran = 10 mots/min. Vers le bas on ralentit jusqu'à l'arrêt ; en insistant, le texte
    // repart en marche arrière. À l'arrêt, un cran de plus est demandé avant de changer de sens.
    const p=D.prefs,haut=e.deltaY<0,avant=vitesseTexte();p.autoTexte=true;G.manuel=0;
    let v=avant;
    if(v===0&&!G.cranArret)G.cranArret=true;                            // le cran d'arrêt : un cran « à vide »
    else{G.cranArret=false;v=clamp(Math.round((v+(haut?10:-10))/10)*10,-200,200)}
    G.vitesse=v;if(v>=30)p.wpm=v;                                      // les réglages gardent la dernière vitesse en avant
    sauverBientot();rendreReglagesGuide();majSouris();
    toast(v===0?'⏸ Arrêt · tournez encore pour repartir':v===avant?(haut?'Vitesse maximale':'Marche arrière maximale'):v<0?`◀ Marche arrière · ${-v} mots/min`:`${haut?'▲ Plus vite':'▼ Moins vite'} · ${v} mots/min`);
  },{passive:false});
  // Clic gauche maintenu : on fait glisser le texte comme avec le doigt sur un téléphone.
  let tire=null,aGlisse=false;
  g.addEventListener('mousedown',e=>{
    if(e.button!==0||libre(e))return;
    const tx=$('#g-texte');if(!tx)return;
    tire={y:e.clientY,haut:tx.scrollTop,tx};aGlisse=false;
  });
  addEventListener('mousemove',e=>{
    if(!tire)return;if(!(e.buttons&1)){tire=null;return}
    const dy=e.clientY-tire.y;
    if(!aGlisse&&Math.abs(dy)<6)return;
    if(!aGlisse){aGlisse=true;g.classList.add('glisse');try{getSelection().removeAllRanges()}catch(_){}}
    e.preventDefault();tire.tx.scrollTop=tire.haut-dy;G.manuel=performance.now()+1500;
  });
  addEventListener('mouseup',()=>{if(!tire)return;tire=null;g.classList.remove('glisse');if(aGlisse)G.manuel=performance.now()+1200});
  g.addEventListener('click',e=>{
    if(aGlisse){aGlisse=false;e.preventDefault();e.stopPropagation();return}   // c'était un glissement, pas un clic
    if(!souris||e.button!==0||libre(e))return;e.preventDefault();e.stopPropagation();
    allerTemps(G.i-1);
  },true);
  g.addEventListener('contextmenu',e=>{
    if(!souris||libre(e))return;e.preventDefault();e.stopPropagation();
    allerTemps(G.i+1);
  },true);
}

  if(rapide){

    $$('#g-rapide [data-rr]').forEach(x=>x.onclick=()=>{if(G)G.vitesse=null;const [k,d]=x.dataset.rr.split(':');p[k]=k==='wpm'?clamp(p.wpm+ +d,40,180):clamp(p.taille+ +d,18,52);if(k==='wpm')p.autoTexte=true;document.documentElement.style.setProperty('--taille',p.taille+'px');sauverBientot();rendreReglagesGuide()});
  }

  $$('#g-reglages [data-r]').forEach(x=>x.onclick=e=>{if(G)G.vitesse=null;e.stopPropagation();const [k,d]=x.dataset.r.split(':');p[k]=k==='wpm'?clamp(p.wpm+ +d,40,180):clamp(p.taille+ +d,18,52);if(k==='wpm')p.autoTexte=true;document.documentElement.style.setProperty('--taille',p.taille+'px');sauverBientot();rendreReglagesGuide()});

function quitterGuide(){arreterEnrSeance();fermerSalle();fermerMenuTuile();clearInterval(tickH);if(A.joue)sortie(1.5);libererEveil();G=null}
async function garderEveil(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}
function libererEveil(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}
document.addEventListener('visibilitychange',()=>{if(vue==='guider'&&G&&G.run&&document.visibilityState==='visible')garderEveil()});
const dureeMs=j=>G.blocs[j].libre?0:(+G.blocs[j].min||0)*60000;
function aujourdhuiA(hm){const [h,m]=hm.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return d.getTime()}
// L’horaire prévu ne sert d’objectif que si la séance démarre à peu près à l’heure (±45 min) ;
// sinon (répétition, séance décalée) l’objectif est simplement « maintenant + durée prévue ».
function calculerObjectif(s){
  if(s.debut&&s.finH){const d=aujourdhuiA(s.debut);if(Math.abs(Date.now()-d)<=45*60000){let f=aujourdhuiA(s.finH);if(f<=d)f+=86400000;return f}}
  return Date.now()+total(s)*60000;
}
// L'audio d'un temps : le morceau d'un temps de musique, ou l'audio (voix…) d'un autre temps.
const audioDe=b=>b?(b.type==='musique'?b.musiqueId:b.voixId)||null:null;
function lancerAudioTemps(b,reprise){
  const au=audioDe(b);if(!au)return;
  if(b.type==='musique'){if(A.joue&&A.id===au)fondu(b.volume/100,reprise?1.5:Math.max(2,b.entree));else jouer(au,b.volume/100,b.entree)}
  else jouer(au,1,.15,!(reprise&&A.id===au));   // une voix part tout de suite, et reprend là où elle était
}
function basculerRun(){
  if(G.termine)return terminer();
  audioInit();A.ctx&&A.ctx.resume();
  G.run=!G.run;G.last=performance.now();
  if(ENR){G.run?ENR.reprendre():ENR.pause();rendreBoutonEnr()}
  if(G.run){
    if(!G.debut){G.debut=Date.now();G.objectif=calculerObjectif(G.s)}
    garderEveil();
    const b=G.blocs[G.i];
    lancerAudioTemps(b,true);
  }else if(A.joue){const b=G.blocs[G.i];
    if(b.type!=='musique'&&A.id===audioDe(b)){A.el.pause();A.joue=false}   // la voix s'arrête net, elle reprendra au même endroit
    else fondu(Math.min(.15,A.gain.gain.value),1.2)}
  majMusique();
  $('#g-go').textContent=G.run?'Pause':'Reprendre';$('#g-go').classList.toggle('pause',G.run);
}
function allerTemps(n){
  if(!G||n<0||n>=G.blocs.length)return;
  {const p=G.blocs[G.i];if(A.joue&&audioDe(p)&&A.id===audioDe(p))sortie(p.type==='musique'?3:.6)}
  G.i=n;G.bloc=0;G.sig[n]=false;G.sortie[n]=false;G.termine=false;G.manuel=0;
  try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
  $('#guide').classList.remove('tiroir');
  afficherTemps();
  const b=G.blocs[n];
  if(G.run)lancerAudioTemps(b,false);
}

function tick(){
  if(!G)return;
  const now=performance.now(),dt=Math.min(1000,now-G.last);G.last=now;
  const b=G.blocs[G.i],dur=dureeMs(G.i);
  if(G.run){
    G.glob+=dt;G.bloc+=dt;G.reel[G.i]+=dt;
    // Un temps à durée libre n'a ni rappel, ni fin automatique : on passe au suivant quand on veut.
    if(!b.libre&&!G.sig[G.i]&&dur-G.bloc<=30000&&dur>45000){G.sig[G.i]=true;signal()}
    if(!b.libre&&b.type==='musique'&&A.joue&&!G.sortie[G.i]&&dur-G.bloc<=b.sortie*1000){G.sortie[G.i]=true;sortie(Math.max(1,b.sortie))}
    if(!b.libre&&G.bloc>=dur){
      if(G.i<G.blocs.length-1&&D.prefs.autoBlocs)allerTemps(G.i+1);
      else if(G.i===G.blocs.length-1&&!G.termine){G.termine=true;finDeSeance()}
    }
    if(D.prefs.autoTexte&&now>G.manuel){const t=$('#g-texte');if(t.scrollHeight>t.clientHeight){
      // Vitesse de la séance (réglée à la roulette, négative = marche arrière), sinon celle des réglages.
      G.reste=(G.reste||0)+(vitesseTexte()/90)*26*(D.prefs.taille/30)*dt/1000;
      const pas=Math.trunc(G.reste);if(pas){t.scrollTop+=pas;G.reste-=pas}}}
  }
  const reste=dur-G.bloc,txt=b.libre?mmss(G.bloc):reste>=0?mmss(reste):'+'+mmss(-reste);
  // Un temps libre n'affiche aucun minuteur.
  $('#g-reste').textContent=b.libre?'Libre':txt;$('#g-reste').classList.toggle('depasse',!b.libre&&reste<0);$('#g-reste').classList.toggle('libre',!!b.libre);$('#gm-reste').textContent=b.libre?'libre':txt;
  const rl=$('#g-reste-lbl');if(rl)rl.textContent=b.libre?'Temps libre':'Reste';
  $('#g-glob').textContent=mmss(G.glob);
  const pc=(b.libre?0:clamp(G.bloc/dur*100,0,100))+'%';$('#g-barre').style.width=pc;const r=$('#rempli');if(r)r.style.width=pc;
  const lr=$('#g-liste-reste');if(lr)lr.textContent=b.libre?'libre':txt;
  const af=$('#a-fin');if(af)af.classList.toggle('imminent',!b.libre&&reste<=30000);
  majLecteur();majHoraire();majEnr();
}

function majHoraire(){

/* ——— Animations : bâton de pluie, vague, tambour (en préparation comme en séance) ——— */
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function animer(){
  const now=performance.now();
  $$('.baton').forEach(el=>{
    const tin=+el.dataset.in||5,tex=+el.dataset.ex||tin,cyc=tin+tex,t=((now-(+el.dataset.t0||0))/1000)%cyc;
    const inspire=t<tin,loc=inspire?t:t-tin,dur=inspire?tin:tex,bascule=Math.min(.9,dur*.22);
    // Inspire : le bâton penche à gauche (extrémité gauche en bas) ; expire : à droite.
    const cible=inspire?-15:15,avant=-cible,k=loc<bascule?ease(loc/bascule):1,angle=avant+(cible-avant)*k;
    const g=el.querySelector('.b-baton');if(g)g.setAttribute('transform',`rotate(${angle.toFixed(2)} 150 89)`);
    // Les grains glissent vers l’extrémité basse pendant toute la phase.
    const q=clamp((loc-bascule*.4)/(dur-bascule*.4),0,1),grains=el.querySelectorAll('.b-grains circle'),n=grains.length;
    grains.forEach((c,i)=>{const f=clamp(q*1.6-(i/n)*.6,0,1),depart=inspire?262-i*3:38+i*3,arrivee=inspire?38+i*9:262-i*9;c.setAttribute('cx',(depart+(arrivee-depart)*f).toFixed(1))});
    const ph=el.querySelector('.phase'),sec=el.querySelector('.sec');
    if(ph){ph.textContent=inspire?'Inspire':'Expire';ph.className='phase '+(inspire?'in':'ex')}
    if(sec)sec.textContent=Math.ceil(dur-loc);
    const cg=el.querySelector('.c-g'),cd=el.querySelector('.c-d');if(cg){cg.style.color=inspire?'var(--canard)':'';cd.style.color=inspire?'':'var(--peri-deep)'}
  });
  // La vague : son front monte sur la plage (moitié du rythme), puis se retire.
  $$('.vague').forEach(el=>{
    const s=+el.dataset.s||8,tt=(now-(+el.dataset.t0||0))/1000,c=(tt%s)/s,arrive=c<.5,u=arrive?c*2:(c-.5)*2;
    const k=(1-Math.cos(Math.PI*u))/2,sable=x=>120-(x-40)*90/560,mer=64,rivage=40+(120-mer)*560/90;
    // Le front de la vague va du rivage jusqu'en haut du sable, puis revient ; la crête le précède.
    const xf=arrive?rivage-70+230*k:rivage+160-230*k,crete=xf-85,bosse=(arrive?1:.35)*24;
    const surface=(x,dec,front)=>{const s=sable(x);
      if(x>rivage)return s-(7-dec*.5)*Math.max(0,1-(x-rivage)/Math.max(1,front-rivage));
      return Math.min(s,mer+dec+4*Math.sin(x/26-tt*2.4)+4*Math.sin(x/75+tt*1.1)-bosse*Math.exp(-(((x-crete)/55)**2)))};
    const trace=(dec,front)=>{let p='M0 120';for(let x=0;x<front;x+=12)p+=` L${x} ${surface(x,dec,front).toFixed(1)}`;return p+` L${front.toFixed(1)} ${sable(front).toFixed(1)} L${front.toFixed(1)} 120 Z`};
    const d=trace(0,xf),d2=trace(6,xf-30),niveau=sable(xf);
    const m=el.querySelector('.v-mer'),m2=el.querySelector('.v-mer2'),e=el.querySelector('.v-ecume');
    if(m){m.setAttribute('d',d);m2.setAttribute('d',d2);e.setAttribute('d',`M${(xf-38).toFixed(1)} ${(surface(xf-38,0,xf)-1).toFixed(1)} Q${(xf-14).toFixed(1)} ${(niveau-5).toFixed(1)} ${xf.toFixed(1)} ${niveau.toFixed(1)}`)}
    const ph=el.querySelector('.v-phase'),sec=el.querySelector('.v-sec');
    if(ph){ph.textContent=arrive?'La vague arrive':'Elle repart';ph.className='phase v-phase '+(arrive?'in':'ex')}
    if(sec)sec.textContent=Math.ceil(s/2-(arrive?c:c-.5)*s);
  });
  $$('.pouls').forEach(el=>{const per=60/(+el.dataset.bpm||60),q=(now/1000%per)/per,a=Math.max(0,1-q*4);el.style.transform=`scale(${1+.35*a})`;el.style.opacity=.25+.5*a});
  requestAnimationFrame(animer);
}

/* ======================== SYNCHRONISATION ========================
   Vos séances, vos blocs, vos bilans et la liste de vos morceaux se retrouvent
   sur tous vos appareils, avec le même compte que votre application Suivi de
   l'Être (table « regie », lisible par vous seulement). Tout reste d'abord sur
   l'appareil : sans internet, la régie marche normalement et se remet à jour
   au retour du réseau. Les fichiers audio restent sur chaque appareil.
   Pendant qu'une séance est guidée ou préparée, rien ne vient la modifier :

/* ——— Compte chiffré (régie offerte) ———
   COMPTE=null : la régie de l'Être (table « regie », réservée à la propriétaire).
   COMPTE={table} : une régie offerte. Chaque compte a sa ligne dans cette
   table et n'y voit qu'elle. Les données y sont chiffrées sur l'appareil avec
   une clé tirée du mot de passe (que seule la personne connaît) : la
   propriétaire de la base ne voit qu'une suite de caractères illisible.
   À la première connexion, le mot de passe provisoire doit être remplacé. */
const COMPTE=null;
const K_ACC=COMPTE?CLE+'.sb_access':'sb_access_token',K_REF=COMPTE?CLE+'.sb_refresh':'sb_refresh_token',K_EXP=COMPTE?CLE+'.sb_expires':'sb_expires_at';
const K_CLE=CLE+'.cle',K_REMPLACE=CLE+'.remplace';
async function deriverCle(mdp,sel){
  const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(mdp),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:sel,iterations:310000},m,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}
async function garderCle(k,sel){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',k));localStorage.setItem(K_CLE,JSON.stringify({sel:versB64u(sel),k:versB64u(raw)}))}
async function cleLocale(){
  let j=null;try{j=JSON.parse(localStorage.getItem(K_CLE)||'null')}catch(e){}
  if(!j)return null;
  return {sel:j.sel,k:await crypto.subtle.importKey('raw',depuisB64u(j.k),'AES-GCM',false,['encrypt','decrypt'])};
}
async function chiffrer(doc){
  const c=await cleLocale();if(!c)throw Object.assign(new Error('cle'),{cle:true});
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},c.k,new TextEncoder().encode(JSON.stringify(doc))));
  return {v:1,sel:c.sel,iv:versB64u(iv),ct:versB64u(ct)};
}
async function dechiffrer(co){
  const c=await cleLocale();if(!c||!co||c.sel!==co.sel)throw Object.assign(new Error('cle'),{cle:true});
  try{return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:depuisB64u(co.iv)},c.k,depuisB64u(co.ct))))}
  catch(e){throw Object.assign(new Error('cle'),{cle:true})}
}

// Empreinte d'un élément : sert à savoir ce qui a changé ici, là-bas, ou des deux côtés.
function hache(o){const s=JSON.stringify(o);let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)+'.'+s.length.toString(36)}
function empreintes(doc){const r={};COLL.forEach(c=>{r[c]={};(doc[c]||[]).forEach(x=>{r[c][x.id]=hache(x)})});return r}
const memes=(a,b)=>COLL.every(c=>{const x=a[c]||{},y=b[c]||{},kx=Object.keys(x);return kx.length===Object.keys(y).length&&kx.every(k=>x[k]===y[k])});
const contenu=d=>{const o={schema:1};COLL.forEach(c=>{o[c]=d[c]||[]});return o};
function lireBase(){try{return JSON.parse(localStorage.getItem(CLE_BASE)||'null')}catch(e){return null}}
function ecrireBase(b){try{localStorage.setItem(CLE_BASE,JSON.stringify(b))}catch(e){}}

// Fusion à trois : ce qui n'a changé que d'un côté est repris tel quel ; un
// élément modifié des deux côtés est gardé en double (rien n'est jamais perdu).
function fusion(local,distant,base){
  const out={};let doubles=0;
  COLL.forEach(c=>{
    const L=new Map((local[c]||[]).map(x=>[x.id,x])),R=new Map((distant[c]||[]).map(x=>[x.id,x])),B=(base&&base[c])||{};
    const ids=[...L.keys(),...[...R.keys()].filter(k=>!L.has(k))];
    const res=[];
    ids.forEach(id=>{
      const l=L.get(id),r=R.get(id),b=B[id],hl=l&&hache(l),hr=r&&hache(r);
      if(l&&r){
        if(hl===hr||b===hr)res.push(l);
        else if(b===hl)res.push(r);
        else{res.push(r);const k=clone(l);k.id=uid();if('titre' in k)k.titre+=' (autre version)';else if('nom' in k)k.nom+=' (autre version)';res.push(k);doubles++}
      }else if(l){if(!(b&&b===hl))res.push(l)}      // supprimé ailleurs sans changement ici → supprimé
      else if(r){if(!(b&&b===hr))res.push(r)}       // supprimé ici sans changement ailleurs → supprimé
    });
    out[c]=res;
  });
  return {doc:out,doubles};
}

// ——— Compte (le même que l'app Suivi de l'Être, sur la même adresse) ———
async function jetonValide(){
  const t=localStorage.getItem(K_ACC),exp=parseInt(localStorage.getItem(K_EXP)||'0',10);
  if(t&&Date.now()<exp-60000)return t;
  const r=localStorage.getItem(K_REF);if(!r)return null;
  try{
    const res=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:r})});
    if(!res.ok)return null;
    const d=await res.json();garderSession(d);return d.access_token;
  }catch(e){return null}
}
function garderSession(d){localStorage.setItem(K_ACC,d.access_token);localStorage.setItem(K_REF,d.refresh_token);localStorage.setItem(K_EXP,String(Date.now()+d.expires_in*1000))}
function oublierSession(){[K_ACC,K_REF,K_EXP,K_CLE,K_REMPLACE].forEach(k=>localStorage.removeItem(k));try{localStorage.removeItem(CLE_BASE)}catch(e){}}
const sb=(chemin,o,jeton)=>fetch(`${SB_URL}/rest/v1/${chemin}`,Object.assign({},o,{headers:Object.assign({apikey:SB_KEY,Authorization:`Bearer ${jeton}`,'Content-Type':'application/json'},(o&&o.headers)||{})}));

function etatSync(e,detail){
  SYN.etat=e;const b=$('#etat-sync');if(!b)return;
  const txt={compte:COMPTE?'Me connecter':'Synchroniser mes appareils',cle:'Mot de passe à saisir',encours:'Synchronisation…',ok:'Synchronisé',horsligne:'Hors ligne · gardé ici',attente:'Mise à jour après la séance',erreur:'Synchro en pause',refuse:'Compte sans accès'}[e]||'';
  b.className='sync '+e;b.innerHTML=`<i></i><span>${txt}</span>`;
  b.title=detail||(e==='ok'&&SYN.derniere?`Dernière synchronisation à ${heureTxt(SYN.derniere)}`:txt);
}

function planifierSync(){clearTimeout(SYN.t);SYN.t=setTimeout(synchroniser,3000)}

async function synchroniser(){
  if(!stockOK)return;
  if(SYN.enCours){SYN.encore=true;return}
  const jeton=await jetonValide();
  if(!jeton){etatSync('compte');return}
  if(navigator.onLine===false){etatSync('horsligne');return}
  SYN.enCours=true;if(SYN.etat!=='ok')etatSync('encours');
  try{
    for(let essai=0;essai<4;essai++){
      const r=await sb(COMPTE?`${COMPTE.table}?select=coffre,version`:'regie?id=eq.1&select=donnees,version',{},jeton);
      if(r.status===401){localStorage.removeItem(K_EXP);etatSync('compte','Session terminée : reconnectez-vous');return}
      if(r.status===404){etatSync('erreur',`Synchronisation pas encore activée (table « ${COMPTE?COMPTE.table:'regie'} » à créer)`);return}
      if(r.status===403){etatSync('refuse');return}
      if(!r.ok)throw new Error('lecture '+r.status);
      let distant=(await r.json())[0]||null;
      if(COMPTE&&distant){
        // Les données en ligne sont chiffrées : on les ouvre avec la clé gardée sur cet appareil.
        try{distant={donnees:await dechiffrer(distant.coffre),version:distant.version}}
        catch(e){
          if(localStorage.getItem(K_REMPLACE)==='1')distant={donnees:{},version:distant.version};   // nouveau mot de passe : on remplace
          else{etatSync('cle','Saisissez votre mot de passe pour ouvrir vos séances en ligne');return}
        }
      }
      const base=lireBase();
      const ici=empreintes(D);
      const vierge=!base&&D.depart&&hache(contenu(D))===D.depart;   // exemples jamais touchés sur cet appareil
      let doubles=0;
      if(distant&&!(base&&base.version===distant.version)){
        // Du nouveau ailleurs : on attend la fin de la séance en cours avant d'y toucher.
        if(occupe()){SYN.differe=true;etatSync('attente');return}
        // Boutons d'origine jamais touchés ici : ceux d'un autre appareil font foi.
        if(D.boutonsVierges&&Array.isArray((distant.donnees||{}).boutons))D.boutons=clone(distant.donnees.boutons);
        if(Array.isArray((distant.donnees||{}).boutons))delete D.boutonsVierges;
        if(vierge){COLL.forEach(c=>{D[c]=distant.donnees[c]||D[c]||[]})}
        else{const f=fusion(D,distant.donnees||{},base&&base.h);COLL.forEach(c=>{D[c]=f.doc[c]});doubles=f.doubles}
        delete D.depart;
        ecrire(D);
        rafraichirApresSync();
      }else if(base&&memes(ici,base.h)){SYN.derniere=new Date();etatSync('ok');return}   // rien de neuf nulle part
      const envoi=contenu(D),h=empreintes(envoi);
      if(distant&&memes(h,empreintes(distant.donnees||{}))){ecrireBase({version:distant.version,h});SYN.derniere=new Date();etatSync('ok');return}
      const appareil=(navigator.userAgentData&&navigator.userAgentData.platform)||(/iPhone|iPad|Android/i.exec(navigator.userAgent)||['ordinateur'])[0];
      const corps=COMPTE?{coffre:await chiffrer(envoi)}:{donnees:envoi};
      const w=COMPTE
        ?(distant
          ?await sb(`${COMPTE.table}?version=eq.${distant.version}`,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({...corps,version:distant.version+1,maj_le:new Date().toISOString(),appareil})},jeton)
          :await sb(COMPTE.table,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({...corps,version:1,appareil})},jeton))
        :(distant
          ?await sb(`regie?id=eq.1&version=eq.${distant.version}`,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({...corps,version:distant.version+1,maj_le:new Date().toISOString(),appareil})},jeton)
          :await sb('regie',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({id:1,...corps,version:1,appareil})},jeton));
      if(w.status===409)continue;
      if(w.status===403){etatSync('refuse');return}                  // créée entre-temps ailleurs : on recommence
      if(!w.ok)throw new Error('écriture '+w.status);
      const ligne=(await w.json())[0];
      if(!ligne)continue;                          // modifiée entre-temps ailleurs : on recommence
      ecrireBase({version:ligne.version,h});localStorage.removeItem(K_REMPLACE);
      SYN.derniere=new Date();etatSync('ok');
      if(doubles)toast(`${doubles>1?doubles+' éléments modifiés':'Un élément modifié'} ici et sur un autre appareil : les deux versions sont gardées`);
      return;
    }
    throw new Error('trop d’essais');
  }catch(e){if(e&&e.cle){etatSync('cle','Saisissez votre mot de passe pour ouvrir vos séances en ligne');return}etatSync(navigator.onLine===false?'horsligne':'erreur',navigator.onLine===false?'':'La synchronisation reprendra toute seule')}
  finally{SYN.enCours=false;if(SYN.encore){SYN.encore=false;setTimeout(synchroniser,400)}}
}

// La clé du coffre en ligne, tirée du mot de passe et du « sel » du coffre (ou d'un sel neuf).
async function ouvrirCoffre(mdp){
  const jeton=await jetonValide();let sel=null;
  try{const r=await sb(`${COMPTE.table}?select=coffre`,{},jeton);const l=r.ok?(await r.json())[0]:null;if(l&&l.coffre&&l.coffre.sel)sel=depuisB64u(l.coffre.sel)}catch(e){}
  if(!sel){sel=crypto.getRandomValues(new Uint8Array(16))}
  await garderCle(await deriverCle(mdp,sel),sel);
}
// Choisir (première fois) ou changer son mot de passe : les données sont rechiffrées avec le nouveau.

      const sel=crypto.getRandomValues(new Uint8Array(16));

async function ouvrirSalle(atelier,seanceId){
  const jeton=await jetonValide();if(!jeton)throw new Error('session');
  const corps=atelier.genre==='rdv'?{hote:true,demandeId:atelier.demandeId}
    :atelier.genre==='agenda'?{hote:true,genre:'rdv',id:atelier.id}
    :atelier.genre==='salle'?{hote:true,genre:'salle',id:atelier.id}
    :{hote:true,atelierId:atelier.id};
  let r;
  try{r=await fetch(`${RDV_API}/api/salle`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${jeton}`},body:JSON.stringify(corps)})}
  catch(e){throw Object.assign(new Error('reseau'),{detail:'je n’ai pas pu joindre le serveur des rendez-vous ('+(e.message||'')+')'})}
  if(r.status===503)throw new Error('non-configure');
  if(r.status===401)throw new Error('session');
  if(!r.ok){const t=await r.text().catch(()=>'');throw Object.assign(new Error('serveur'),{detail:'le serveur a répondu '+r.status+' '+t.slice(0,120)})}
  const j=await r.json();
  try{await chargerLiveKit()}
  catch(e){throw Object.assign(new Error('chargement'),{detail:'le module vidéo n’a pas pu être téléchargé (bloqueur de publicité ? réseau ?)'})}
  const {Room,RoomEvent,VideoPresets}=LivekitClient;
  const room=new Room({adaptiveStream:true,dynacast:true,videoCaptureDefaults:{resolution:VideoPresets.h540.resolution,deviceId:SALLE.camId||undefined},audioCaptureDefaults:{deviceId:SALLE.micId||undefined,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  Object.assign(SALLE,{actif:true,room,atelier,mode:'cercle',manuel:false,pause:false,aparte:null,instruments:null,alertes:[],chat:[],chatOuvert:false,chatNonLus:0,ecran:false,pubMusique:null,etat:'connexion'});
  brancherSalle(room,RoomEvent);
  try{await room.connect(j.url,j.token)}
  catch(e){SALLE.actif=false;
    let sup='';
    try{
      const v=await fetch(`${RDV_API}/api/salle`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${jeton}`},body:JSON.stringify({hote:true,verifier:true})}).then(x=>x.json());
      sup=v.ok?' · les clés sont acceptées par le service vidéo : le refus vient d’ailleurs'
        :' · le service vidéo refuse les clés ('+(v.statut||v.raison||'')+' '+(v.message||'')+') · clé '+(v.cle||'?')+', secret de '+(v.secret||'?')+(v.espaces?' · une espace ou un retour à la ligne traîne au début ou à la fin':'');
    }catch(_){}
    throw Object.assign(new Error('connexion'),{detail:'le service vidéo a refusé la connexion : '+(e.message||e)+' · adresse '+String(j.url||'').split('//').pop()+sup})}
  SALLE.etat='ok';
  const {Track,AudioPresets}=LivekitClient;
  try{await room.localParticipant.setCameraEnabled(true)}catch(e){}
  try{await room.localParticipant.setMicrophoneEnabled(true,undefined,{audioPreset:AudioPresets.musicHighQuality,dtx:false})}catch(e){}
  if(SALLE.sonId){try{await room.switchActiveDevice('audiooutput',SALLE.sonId)}catch(e){}}
  // La musique du lecteur part directement dans la salle.
  audioInit();try{await A.ctx.resume()}catch(e){}
  if(A.ctx&&A.gain){
    A.dest=A.dest||A.ctx.createMediaStreamDestination();
    try{A.gain.connect(A.dest)}catch(e){}
    ecouteMusique(SALLE.ecoute);
    try{SALLE.pubMusique=await room.localParticipant.publishTrack(A.dest.stream.getAudioTracks()[0],{name:'musique',source:Track.Source.ScreenShareAudio,audioPreset:AudioPresets.musicHighQualityStereo,dtx:false,red:false,forceStereo:true})}catch(e){}
  }
  window.addEventListener('beforeunload',avantDeFermer);
  aller('guider',seanceId);
  diffuserEtat();
}
function avantDeFermer(e){if(SALLE.actif){e.preventDefault();e.returnValue=''}}
// Musique : chez eux toujours ; chez vous seulement si vous avez un casque.
function ecouteMusique(oui){
  SALLE.ecoute=oui;if(!A.ctx||!A.gain)return;
  try{A.gain.disconnect(A.ctx.destination)}catch(e){}
  if(oui)A.gain.connect(A.ctx.destination);
}
function fermerSalle(){
  if(!SALLE.actif)return;
  const r=SALLE.room;
  envoyerSalle({t:'fin'});
  setTimeout(()=>{try{r&&r.disconnect()}catch(e){}},400);
  if(A.ctx&&A.gain){try{A.gain.disconnect(A.dest)}catch(e){}ecouteMusique(true)}
  Object.assign(SALLE,{actif:false,room:null,atelier:null,aparte:null,alertes:[],pubMusique:null,etat:''});
  window.removeEventListener('beforeunload',avantDeFermer);
}

// Les sons des participants : un conteneur fixe, jamais redessiné (le son ne s'interrompt pas).
function conteneurSons(){let d=$('#sl-sons');if(!d){d=document.createElement('div');d.id='sl-sons';d.className='cache';document.body.appendChild(d)}return d}
function brancherSalle(room,RoomEvent){
  const maj=()=>rendreSalle();
  room.on(RoomEvent.ParticipantConnected,p=>{maj();diffuserEtat(p.identity);if(SALLE.aparte)permissionsHote()});
  room.on(RoomEvent.ParticipantDisconnected,maj);
  room.on(RoomEvent.TrackSubscribed,(t,pub,p)=>{if(t.kind==='audio'){const el=t.attach();el.dataset.p=p.identity;conteneurSons().appendChild(el)}maj()});
  room.on(RoomEvent.TrackUnsubscribed,t=>{t.detach().forEach(e=>e.remove());maj()});
  room.on(RoomEvent.TrackMuted,maj);room.on(RoomEvent.TrackUnmuted,maj);
  room.on(RoomEvent.ParticipantAttributesChanged,maj);
  room.on(RoomEvent.ActiveSpeakersChanged,sp=>$$('.sl-tuile').forEach(t=>t.classList.toggle('parle',sp.some(p=>p.identity===t.dataset.p))));
  room.on(RoomEvent.Reconnecting,()=>{SALLE.etat='reconnexion';maj()});
  room.on(RoomEvent.Reconnected,()=>{SALLE.etat='ok';maj();diffuserEtat()});
  room.on(RoomEvent.Disconnected,()=>{if(SALLE.actif){SALLE.etat='coupee';maj()}});
  room.on(RoomEvent.DataReceived,(payload,p)=>{if(!p)return;let m;try{m=JSON.parse(new TextDecoder().decode(payload))}catch(e){return}recevoirSalle(m,p)});
}

function recevoirSalle(m,p){
  const nom=p.name||'Quelqu’un';
  if(m.t==='bonjour')return diffuserEtat(p.identity);
  if(m.t==='aide'){alerteSalle({type:'aide',id:p.identity,nom});return}
  if(m.t==='mot'){alerteSalle({type:'mot',id:p.identity,nom,texte:String(m.texte||'').slice(0,500)});return}
  if(m.t==='moment'){alerteSalle({type:'moment',id:p.identity,nom});return}
  if(m.t==='chat'){SALLE.chat.push({nom,texte:String(m.texte||'').slice(0,400),h:new Date()});if(!SALLE.chatOuvert)SALLE.chatNonLus++;rendreSalle();toast(nom+' : '+String(m.texte||'').slice(0,60));return}
  rendreSalle();
}
function alerteSalle(a){
  a.k=uid();a.h=new Date();SALLE.alertes.unshift(a);
  const g=$('#guide');if(g&&a.type==='aide'){g.classList.remove('sl-alerte');void g.offsetWidth;g.classList.add('sl-alerte')}
  try{navigator.vibrate&&navigator.vibrate(a.type==='aide'?[200,100,200]:60)}catch(e){}
  if(a.type!=='aide')toast(a.type==='mot'?`✉ Un petit mot de ${esc(a.nom)}`:`${esc(a.nom)} a besoin d’un moment`);
  rendreSalle();
}

/* ——— Modes, micro, aparté ——— */
function salleSurTemps(b){
  if(!SALLE.actif)return;
  SALLE.manuel=false;SALLE.mode=modeDuTemps(b);
  profilMicro(SALLE.mode==='musique');
  diffuserEtat();rendreSalle();
}
function choisirMode(m){
  if(m==='pause'){SALLE.pause=!SALLE.pause}
  else{SALLE.mode=m;SALLE.manuel=true;profilMicro(m==='musique')}
  diffuserEtat();rendreSalle();
}
// Voix : traitements du navigateur (écho, bruit). Instruments : son brut, fidèle.
async function profilMicro(instruments){
  const r=SALLE.room;if(!r||SALLE.instruments===instruments)return;
  const pub=r.localParticipant.getTrackPublication(LivekitClient.Track.Source.Microphone);if(!pub||!pub.track)return;
  SALLE.instruments=instruments;
  try{await pub.track.restartTrack({deviceId:SALLE.micId||undefined,echoCancellation:!instruments,noiseSuppression:!instruments,autoGainControl:!instruments})}catch(e){}
  rendreSalle();
}
// En aparté, la personne choisie a votre voix et votre image ; les autres gardent la musique.
function permissionsHote(){
  const r=SALLE.room;if(!r)return;const lp=r.localParticipant;
  if(!SALLE.aparte)return lp.setTrackSubscriptionPermissions(true,[]);
  const sid=SALLE.pubMusique&&SALLE.pubMusique.trackSid;
  const autres=[...r.remoteParticipants.values()].filter(p=>p.identity!==SALLE.aparte).map(p=>({participantIdentity:p.identity,allowAll:false,allowedTrackSids:sid?[sid]:[]}));
  lp.setTrackSubscriptionPermissions(false,[{participantIdentity:SALLE.aparte,allowAll:true},...autres]);
}
function aparte(id){
  const avant=SALLE.aparte;
  if(avant&&avant!==id)envoyerSalle({t:'aparte',on:false},avant);
  SALLE.aparte=id&&id!==avant?id:null;
  permissionsHote();
  if(SALLE.aparte){envoyerSalle({t:'aparte',on:true},SALLE.aparte);profilMicro(false)}
  else if(avant)envoyerSalle({t:'aparte',on:false},avant);
  diffuserEtat();rendreSalle();
}
function traiterAlerte(k){
  const a=SALLE.alertes.find(x=>x.k===k);if(!a)return;
  if(a.type!=='moment')envoyerSalle({t:'recu',quoi:a.type},a.id);
  SALLE.alertes=SALLE.alertes.filter(x=>x!==a);rendreSalle();
}
function micHote(on){const r=SALLE.room;if(!r)return;r.localParticipant.setMicrophoneEnabled(on).then(rendreSalle).catch(()=>{})}
function camHote(on){const r=SALLE.room;if(!r)return;r.localParticipant.setCameraEnabled(on).then(rendreSalle).catch(()=>{})}

/* ——— La colonne « salle » ——— */
function monterSalle(){
  const g=$('#guide');if(!g)return;
  g.classList.add('visio');g.classList.toggle('grande',SALLE.grand);
  $('#g-salle').classList.remove('cache');
  rendreSalle();
}
let menuTuile=null;
function rendreSalle(){
  const el=$('#g-salle');if(!el||!SALLE.actif)return;
  const r=SALLE.room,{Track}=window.LivekitClient||{};
  const gens=r?[...r.remoteParticipants.values()]:[];
  const at=p=>p.attributes||{};
  const ok=gens.filter(p=>at(p).ok).length;
  const pasOk=gens.filter(p=>!at(p).ok);
  const lp=r&&r.localParticipant;
  const micPub=lp&&Track&&lp.getTrackPublication(Track.Source.Microphone),camPub=lp&&Track&&lp.getTrackPublication(Track.Source.Camera);
  const micOn=!!(micPub&&!micPub.isMuted),camOn=!!(camPub&&!camPub.isMuted);

  v.innerHTML=`<div class="fenetre">

  const fermer=()=>{try{navigator.mediaDevices.ondevicechange=null}catch(e){}v.remove()};

/* ================= REPRENDRE L'ANCIENNE RÉGIE (v14) =================
   L'ancienne régie garde la séance chiffrée sur son propre serveur : elle se
   déverrouille avec le nom d'espace et le mot de passe choisis à l'époque.
   Le mot de passe ne quitte jamais cet appareil : seul un code dérivé est
   envoyé, comme le faisait l'ancienne page. Rien n'est modifié là-bas : la
   séance est simplement recopiée ici. */
const V14_URL = 'https://kzviewbnnnzdyocdjtah.supabase.co/functions/v1/regie-sync';
const V14_TYPE = { 0: 'parole', 1: 'instrument', 2: 'instrument', 3: 'musique', 4: 'silence' };
const V14_INSTR = { 1: 'pluie', 2: 'ocean' };
const teB = new TextEncoder(), tdB = new TextDecoder();
const versB64u = o => { let s = ''; for (const b of o) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '') };
const depuisB64u = s => { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const x = atob(s), a = new Uint8Array(x.length); for (let i = 0; i < x.length; i++) a[i] = x.charCodeAt(i); return a };
const sha256 = async o => new Uint8Array(await crypto.subtle.digest('SHA-256', o));
const colle = (...p) => { const r = new Uint8Array(p.reduce((a, x) => a + x.length, 0)); let o = 0; for (const x of p) { r.set(x, o); o += x.length } return r };
async function v14Api(action, payload) {
  const r = await fetch(V14_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, ...payload }) });
  let j = {}; try { j = await r.json() } catch (e) {}
  if (!r.ok) { const e = new Error(j.error || 'http_' + r.status); e.status = r.status; throw e }
  return j;
}
async function v14Ouvrir(nom, motDePasse) {
  const normal = String(nom || '').normalize('NFKC').trim().toLocaleLowerCase('fr-FR').replace(/\s+/g, ' ');
  const empreinte = [...await sha256(teB.encode('regie-user-v1|' + normal))].map(b => b.toString(16).padStart(2, '0')).join('');
  const ch = await v14Api('challenge', { usernameHash: empreinte });
  if (!ch.exists) throw new Error('espace');
  const materiel = await crypto.subtle.importKey('raw', teB.encode(motDePasse), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: depuisB64u(ch.authSalt), iterations: 250000 }, materiel, 512));
  const authKey = bits.slice(0, 32), wrapKey = bits.slice(32, 64);
  const verifieur = versB64u(await sha256(colle(teB.encode('regie-auth-v1|'), authKey)));
  const r = await v14Api('login', { usernameHash: empreinte, authVerifier: verifieur });
  const ouvre = async (cle, iv, ct) => new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: depuisB64u(iv) }, await crypto.subtle.importKey('raw', cle, { name: 'AES-GCM' }, false, ['decrypt']), depuisB64u(ct)));
  const dek = await ouvre(wrapKey, r.passwordBundle.iv, r.passwordBundle.ciphertext);
  if (!r.dataCiphertext) throw new Error('vide');
  const etat = JSON.parse(tdB.decode(await ouvre(dek, r.dataIv, r.dataCiphertext)));
  if (!etat || !Array.isArray(etat.phases) || !etat.phases.length) throw new Error('vide');
  return etat;
}
// « Atelier de méditation — 19h30 à 21h » → titre, début et fin
function v14Seance(etat) {
  const brut = String(etat.title || 'Séance reprise de l’ancienne régie');
  const h = brut.match(/(\d{1,2})\s*h\s*(\d{2})?\s*(?:à|-|–)\s*(\d{1,2})\s*h\s*(\d{2})?/i);
  const deux = n => String(n).padStart(2, '0');
  return {
    id: uid(), genre: 'atelier',
    titre: brut.replace(/\s*[—–-]\s*\d{1,2}\s*h.*$/i, '').trim() || brut,
    debut: h ? `${deux(h[1])}:${h[2] || '00'}` : '', finH: h ? `${deux(h[3])}:${h[4] || '00'}` : '',
    blocs: etat.phases.map(p => {
      const i = Number(p.instrument) || 0;
      return nb(V14_TYPE[i] || 'parole', String(p.name || 'Temps').slice(0, 80), Math.max(1, Number(p.minutes) || 5), {
        texte: String(p.text || ''), repere: p.cue && p.cue !== '[silence]' ? String(p.cue) : '',
        instrument: V14_INSTR[i] || null, rythme: i === 1 ? 5 : i === 2 ? 8 : null, expire: i === 1 ? 5 : null,
        position: i === 4 ? 'assis' : null,
      });
    }),
  };
}

// Une sauvegarde de l'ancienne régie peut contenir plusieurs séances.
function v14Seances(etat) {
  const liste = Array.isArray(etat.sessions) && etat.sessions.length
    ? etat.sessions.filter(x => x && Array.isArray(x.phases) && x.phases.length).map(x => ({ title: x.title || x.name || 'Séance', phases: x.phases }))
    : (Array.isArray(etat.phases) && etat.phases.length ? [{ title: etat.title, phases: etat.phases }] : []);
  return liste.map(v14Seance);
}
function ajouterSeances(seances, origine) {
  if (!seances.length) { toast('Aucune séance trouvée dans ce fichier'); return }
  const resume = seances.map(s => `• « ${s.titre} » — ${s.blocs.length} temps, ${dureeTxt(total(s))}`).join('\n');
  if (!confirm(`${seances.length} séance${seances.length > 1 ? 's' : ''} ${origine} :\n\n${resume}\n\nLes ajouter à vos séances ?`)) return;
  seances.forEach(s => D.seances.push(s));
  delete D.depart; sauver();
  aller(seances.length === 1 ? 'editer' : 'seances', seances.length === 1 ? seances[0].id : undefined);
  toast(seances.length > 1 ? `${seances.length} séances reprises` : 'Séance reprise de l’ancienne régie');
}
// Fichier de sauvegarde : ancienne régie (phases) ou nouvelle régie (séances).
$('#f-ancienne').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const x = JSON.parse(await f.text());
    if (Array.isArray(x.seances)) {
      const connues = new Set(D.seances.map(s => s.id));
      const neuves = x.seances.filter(s => s && Array.isArray(s.blocs) && !connues.has(s.id));
      return ajouterSeances(neuves, 'dans cette sauvegarde');
    }
    ajouterSeances(v14Seances(x), 'dans ce fichier');
  } catch (err) { toast('Ce fichier n’est pas une sauvegarde de régie') }
};

function fenetreImport() {
  if ($('#voile-import')) return;
  const v = document.createElement('div'); v.className = 'voile'; v.id = 'voile-import';
  v.innerHTML = `<form class="fenetre" id="f-import" autocomplete="off">
    <h2>Reprendre l’ancienne régie</h2>
    <p class="sous" style="margin:0 0 14px">Votre séance de l’ancienne page (« Régie de mon Hêtre ») est protégée par le nom d’espace et le mot de passe que vous aviez choisis. Elle sera <b>recopiée ici</b>, sans rien changer là-bas.</p>
    <label class="champ">Nom d’espace<input type="text" id="im-nom" autocomplete="off"></label>
    <label class="champ">Mot de passe<input type="password" id="im-mdp" autocomplete="off"></label>
    <p class="aide">Votre mot de passe ne quitte pas cet appareil.</p>
    <div class="err cache" id="im-err"></div>
    <p class="aide" style="margin:10px 0 0">Mot de passe perdu ? <button type="button" class="lien" id="im-fichier">Importer un fichier de l’ancienne régie</button></p>
    <div class="actions"><button type="button" class="btn" id="im-annuler">Plus tard</button><button type="submit" class="btn p" id="im-ok">Récupérer ma séance</button></div>
  </form>`;
  document.body.appendChild(v);
  $('#im-annuler').onclick = () => v.remove();
  $('#im-fichier').onclick = () => { v.remove(); $('#f-ancienne').click() };
  v.onclick = e => { if (e.target === v) v.remove() };
  $('#f-import').onsubmit = async e => {
    e.preventDefault();
    const ok = $('#im-ok'), err = $('#im-err');
    ok.disabled = true; ok.textContent = 'Un instant…'; err.classList.add('cache');
    try {
      const etat = await v14Ouvrir($('#im-nom').value, $('#im-mdp').value);
      v.remove();
      ajouterSeances(v14Seances(etat), 'dans votre ancienne régie');
    } catch (x) {
      err.classList.remove('cache');
      err.textContent = x.message === 'espace' ? 'Ce nom d’espace n’existe pas sur l’ancienne régie.'
        : /invalid|401/.test(x.message || '') ? 'Mot de passe incorrect.'
        : x.message === 'vide' ? 'Aucune séance n’est enregistrée dans cet espace.'
        : 'Récupération impossible pour le moment (connexion ?).';
      ok.disabled = false; ok.textContent = 'Récupérer ma séance';
    }
  };
  setTimeout(() => $('#im-nom').focus(), 50);
}

/* =============================== DÉMARRAGE =============================== */
if(!stockOK)$('#bandeau').innerHTML=`<div class="bandeau">${IC.info}<span><b>Aperçu :</b> cet affichage ne permet pas d’enregistrer. Ouvrez ce fichier dans votre navigateur (Chrome, Edge…) pour garder vos séances.</span></div>`;
document.body.classList.toggle('nuit',D.prefs.nuit);
if(D.depart===null)D.depart=hache(contenu(D));
ecrire(D);etatSave('Enregistré');
// Raccourcis d’adresse : #preparer ou #guider ouvrent directement la première séance.
// (#guider-3 ou #preparer-3 : directement au 3e temps)
const raccourci=location.hash.match(/^#(guider|preparer)(?:-(\d+))?$/),s0=D.seances[0];
if(raccourci&&s0){const n=Math.max(0,(+raccourci[2]||1)-1);
  if(raccourci[1]==='guider'){aller('guider',s0.id);if(n)allerTemps(n)}else{aller('editer',s0.id);if(s0.blocs[n]){selId=s0.blocs[n].id;rendreListe();rendreTemps()}}}
else aller('seances');
demarrerSync();
setTimeout(retrouverEnr,800);
const visioDirect=location.hash.match(/^#visio(?:-(\d+))?$/);
if(visioDirect)setTimeout(()=>fenetreSalle((D.seances.find(x=>x.genre==='atelier')||D.seances[0]||{}).id,visioDirect[1]),300);
// En ligne (https) : la régie s'installe comme une application et marche sans internet.
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
