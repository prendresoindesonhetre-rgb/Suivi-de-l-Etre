<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f0fb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Régie">
<title>Régie de l’Être</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.lien-boite{background:var(--canard-light);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--canard-dark);font-weight:600;word-break:break-all;margin:10px 0}
.fs-detail{margin-top:6px;font-size:12px;color:var(--muted);word-break:break-word}
:root{
  --fond:#f4f0fb; --carte:rgba(255,255,255,.88); --plein:#fff; --ink:#383650; --muted:#6b6880;
  --line:#e4dff0; --line-bleu:#bfdaf3; --canard:#2c7a87; --canard-deep:#1a7a7a; --canard-dark:#145f5f; --canard-light:#e8f5f5;
  --aqua-pale:#d7eff4; --aqua:#a9ddf6; --violet-soft:#ede6f6; --violet:#b79bd9; --peri-deep:#4a3f8f; --peri-darker:#3a3173;
  --ecorce:#a0734f; --ok:#3f9a74; --ok-pale:#dff2e8; --attente:#e0913f; --attente-pale:#fbecd9; --info:#4f8fd0; --info-pale:#e3eefa; --alerte:#c8566e;
  --t-parole:#ede6f6; --t-parole-f:#4a3f8f; --t-instrument:#d7eff4; --t-instrument-f:#1f7480; --t-musique:#f5e1f0; --t-musique-f:#8a4a7d;
  --t-silence:#ecebf1; --t-silence-f:#6b687e; --t-transition:#dcf0df; --t-transition-f:#3c7a4b; --t-partage:#f8e6d3; --t-partage-f:#a0673a;
  --ombre:0 18px 46px -30px rgba(56,54,80,.42); --serif:"Fraunces",Georgia,serif; --sans:"Mulish",system-ui,sans-serif;
  --taille:30px; --haut:57px; --sable:#ecdcc6;
}
body.nuit{
  --fond:#13111b; --carte:#1b1827; --plein:#1d1a2a; --ink:#d9d3ec; --muted:#8d88a6; --line:#2a2640; --line-bleu:#343049;
  --canard:#7fbcc4; --canard-deep:#5da3ad; --canard-dark:#a2d6dd; --canard-light:#1d2a31; --aqua-pale:#1b262e; --violet-soft:#241f36;
  --peri-deep:#8f83d6; --peri-darker:#d2c8f3; --ecorce:#c99c76;
  --t-parole:#28223b; --t-parole-f:#b9acec; --t-instrument:#1a2b31; --t-instrument-f:#86cbd5; --t-musique:#2d2130; --t-musique-f:#dba3cf;
  --t-silence:#23212c; --t-silence-f:#aaa6be; --t-transition:#1c2a21; --t-transition-f:#97cda4; --t-partage:#2d241b; --t-partage-f:#dcb48a;
  --ombre:none; --sable:#3b3126;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--fond);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased;transition:background .6s,color .6s}
body:not(.nuit)::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(52% 34% at 82% 1%,rgba(169,221,246,.42),transparent 66%),radial-gradient(44% 28% at 6% 12%,rgba(235,218,244,.55),transparent 70%),radial-gradient(50% 30% at 96% 52%,rgba(215,239,219,.42),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.cache{display:none!important}
/* Le logo en filigrane, très léger, sur la page d'accueil */
.filigrane{position:fixed;inset:var(--haut) 0 0 0;z-index:-1;pointer-events:none;background:url(logo.png) center 62%/min(52vw,400px) no-repeat;opacity:.13}
body.nuit .filigrane{opacity:.08}
svg{display:block;flex:none}

/* ——— Barre du haut ——— */
.haut{position:sticky;top:0;z-index:30;height:var(--haut);background:rgba(244,240,251,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body.nuit .haut{background:rgba(19,17,27,.92)}
.haut .in{height:100%;max-width:1400px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:12px}
.marque{display:flex;align-items:center;gap:9px;flex:none}
.marque img{height:34px}
.marque span{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--canard);white-space:nowrap}
.onglets{display:flex;gap:2px;margin-left:14px}
.onglets button{border:none;background:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);transition:.2s}
.onglets button:hover{color:var(--peri-darker)}
.onglets button.on{background:var(--violet-soft);color:var(--peri-darker)}
.haut .droite{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.etat-save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.etat-save i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
@media(max-width:760px){.haut{height:auto}.haut .in{flex-wrap:wrap;padding:8px 14px;gap:6px}.onglets{order:3;width:100%;margin:0;overflow-x:auto}.onglets button{padding:7px 12px;font-size:13px}.marque span{font-size:17px}.etat-save{display:none}}

/* ——— Éléments communs ——— */
.page{max-width:900px;margin:0 auto;padding:26px 18px 80px}
h1.titre{font-family:var(--serif);font-weight:400;font-size:34px;color:var(--peri-darker);margin:0}
.sous{color:var(--muted);line-height:1.6;margin:6px 0 20px;font-size:14.5px}
.kicker{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--canard)}
.btn{border:1px solid var(--line-bleu);background:var(--plein);color:var(--canard-dark);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;justify-content:center;transition:.2s;white-space:nowrap}
.btn:hover{background:var(--aqua-pale)}
.btn.p{background:var(--peri-deep);border-color:var(--peri-deep);color:#fff;box-shadow:0 14px 28px -16px rgba(74,63,143,.9)}
.btn.p:hover{filter:brightness(1.08)}
.btn.c{background:var(--canard);border-color:var(--canard);color:#fff}
.btn.s{padding:7px 13px;font-size:12.5px}
.btn.rond{width:38px;height:38px;padding:0;border-radius:50%}
.btn.nu{border-color:transparent;background:transparent}
.btn.nu:hover{background:var(--violet-soft)}
.btn.danger{color:var(--alerte)}
.btn:disabled{opacity:.4;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;white-space:nowrap}
input[type=text],input[type=time],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--plein);font-size:14px;color:var(--ink)}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--aqua);box-shadow:0 0 0 4px rgba(169,221,246,.3)}
.champ{display:block;font-size:12px;font-weight:800;color:var(--peri-darker);margin-bottom:14px}
.champ > input,.champ > select,.champ > textarea{margin-top:6px;font-weight:500}
.aide{font-size:11.5px;font-weight:500;color:var(--muted);display:block;margin-top:5px;line-height:1.45}
.pas{display:flex;align-items:center;gap:6px;margin-top:6px}
.pas b{min-width:64px;text-align:center;font-size:15px}
.pas .btn{width:34px;height:34px;padding:0;border-radius:50%;font-size:17px}
.bascule{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;cursor:pointer}
.bascule input{width:18px;height:18px;accent-color:var(--canard);margin:0}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,16px);background:#283331;color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;z-index:100;box-shadow:0 10px 30px #0004;max-width:92%;text-align:center;opacity:0;pointer-events:none;transition:.3s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.bandeau{max-width:1400px;margin:0 auto;padding:9px 18px;background:var(--attente-pale);color:#6e4412;font-size:13px;line-height:1.5;display:flex;gap:9px;align-items:center}
.vide{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px;line-height:1.6}
.menu{position:relative}
.menu-liste{position:absolute;right:0;top:calc(100% + 6px);background:var(--plein);border:1px solid var(--line);border-radius:16px;box-shadow:0 22px 50px -24px rgba(56,54,80,.55);padding:6px;min-width:230px;z-index:40;display:none}
.menu.ouvert .menu-liste{display:block;animation:entre .2s ease}
.menu-liste button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:none;padding:10px 11px;border-radius:11px;font-size:13.5px;font-weight:600}
.menu-liste button:hover{background:var(--violet-soft)}
.menu-liste .sep{height:1px;background:var(--line);margin:4px 6px}
.menu-liste .bloc-reglage{padding:8px 11px;font-size:13px}
@keyframes entre{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ——— Couleurs des types ——— */
.t-parole{background:var(--t-parole);color:var(--t-parole-f)}.t-instrument{background:var(--t-instrument);color:var(--t-instrument-f)}
.t-musique{background:var(--t-musique);color:var(--t-musique-f)}.t-silence{background:var(--t-silence);color:var(--t-silence-f)}
.t-transition{background:var(--t-transition);color:var(--t-transition-f)}.t-partage{background:var(--t-partage);color:var(--t-partage-f)}
.f-parole{background:var(--t-parole-f)}.f-instrument{background:var(--t-instrument-f)}.f-musique{background:var(--t-musique-f)}
.f-silence{background:var(--t-silence-f)}.f-transition{background:var(--t-transition-f)}.f-partage{background:var(--t-partage-f)}

/* ——— Frise fine ——— */
.frise{display:flex;gap:2px;height:8px}
.frise .seg{position:relative;border-radius:4px;overflow:hidden;opacity:.55;min-width:3px}
.frise .seg.fait{opacity:.9}
.frise .seg.courant{opacity:1}
.frise .seg .rempli{position:absolute;left:0;top:0;bottom:0;background:rgba(56,54,80,.28)}
body.nuit .frise .seg .rempli{background:rgba(255,255,255,.3)}
.frise.large{height:12px}

/* ——— Bibliothèque ——— */
.tete-page{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tete-page .sous{margin-bottom:0}
.liste-seances{display:grid;gap:12px}
.ls{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:var(--carte);border:1px solid var(--line);border-radius:24px;padding:20px 22px;box-shadow:var(--ombre)}
.ls h3{font-family:var(--serif);font-weight:400;font-size:25px;color:var(--peri-darker);margin:0 0 4px;cursor:pointer}
.ls .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ls .frise{margin-top:14px}
.ls-actions{display:flex;gap:8px;align-items:center}
.nouvelle{border:1.5px dashed var(--line-bleu);background:transparent;border-radius:24px;padding:20px;color:var(--canard-dark);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.nouvelle:hover{background:var(--aqua-pale)}
@media(max-width:640px){.ls{grid-template-columns:1fr}.ls-actions .btn.p{flex:1}}
.legende{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:16px}
.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ——— Espace de travail en 3 colonnes (Préparer et Guider) ——— */
.espace{display:grid;grid-template-columns:250px minmax(0,1fr) 310px;height:calc(100dvh - var(--haut) - 58px);min-height:480px}
.col{min-height:0;overflow:auto;scrollbar-width:thin}
.col-temps{border-right:1px solid var(--line);padding:14px 10px 20px 12px}
.col-outils{border-left:1px solid var(--line);padding:16px 16px 30px}
.col-centre{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.g-main .col-centre{overflow:hidden}
.titre-col{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 10px}

/* Liste des temps */
.tl{display:flex;flex-direction:column;gap:3px}
.ti{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px 8px 0;border-radius:12px;cursor:pointer;transition:background .2s,opacity .3s;border:1px solid transparent}
.ti:hover{background:var(--carte)}
.ti .b{align-self:stretch;border-radius:4px;opacity:.75}
.ti .n{min-width:0}
.ti .n b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .n small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .d{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.ti.sel,.ti.courant{background:var(--plein);border-color:var(--line);box-shadow:0 0 0 2px var(--peri-deep)}
.ti.courant .d{color:var(--canard)}
.ti.fait{opacity:.42}
.ti.drag{opacity:.35}
.ti.cible{box-shadow:0 -3px 0 var(--canard)}
.ti .souple{font-size:10px;font-weight:800;color:var(--muted);border:1px dashed currentColor;border-radius:999px;padding:0 6px;margin-left:4px}
.ajout-types{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.ajout-types{margin-top:0}
.ajout-types button{border:none;border-radius:12px;padding:8px 6px;font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:5px;justify-content:center;min-width:0}
.ajout-types button span{overflow:hidden;line-height:1.2;text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;hyphens:auto}
/* Actions rapides sur un temps de la liste */
.ti{position:relative}
.ti-act{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:none;gap:1px;background:var(--plein);border:1px solid var(--line);border-radius:999px;padding:2px;box-shadow:0 6px 16px -10px rgba(56,54,80,.5)}
@media(hover:hover){.ti:hover .ti-act{display:flex}}
@media(hover:none){.ti.sel .ti-act{display:flex;position:static;transform:none;grid-column:2/4;justify-self:start;margin-top:4px}}
.ti.renomme .ti-act{display:none}
.ti-act button{border:none;background:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--canard-dark);padding:0}
.ti-act button:hover{background:var(--violet-soft)}
.ti-act button:disabled{opacity:.3}
.ti-act button.danger{color:var(--alerte)}
.ti-act svg{width:13px;height:13px}
.ti .ti-nom{padding:3px 6px;font-size:13.5px;font-weight:700;border-radius:8px}
.ti.mb{padding-top:6px;padding-bottom:6px}
/* Gérer ses boutons et ses blocs */
.lien-gerer{border:none;background:none;color:var(--canard-dark);font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px}
.lien-gerer:hover{background:var(--violet-soft)}
.lien-gerer.on{background:var(--canard);color:#fff}
.lien-gerer svg{width:13px;height:13px}
.repli{border:none;background:none;padding:2px 4px 2px 0;display:inline-flex;align-items:center;gap:4px;cursor:pointer;border-radius:8px}
.repli:hover{background:var(--violet-soft)}
.repli .kicker{white-space:nowrap;letter-spacing:.12em}
.repli-tete{gap:4px}
.repli .fl{font-style:normal;color:var(--canard);font-size:12px;width:12px;display:inline-block;transition:transform .2s}
.repli.ferme .fl{transform:rotate(-90deg)}
.g-liste{display:flex;flex-direction:column;gap:5px}
.g-ligne{display:grid;grid-template-columns:12px 4px minmax(0,1fr);gap:6px;align-items:stretch;background:var(--plein);border:1px solid var(--line);border-radius:12px;padding:6px 6px 4px 4px}
.g-ligne .b{border-radius:4px;opacity:.75}
.poignee{cursor:grab;color:var(--muted);font-size:11px;letter-spacing:-2px;align-self:center;user-select:none;text-align:center}
.g-corps{min-width:0}
.g-corps input[type=text]{padding:4px 6px;font-size:13px;font-weight:700;border-radius:8px}
.g-corps small{display:block;font-size:11px;color:var(--muted);margin:3px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-reglages{display:flex;gap:4px;margin-top:4px}
.g-reglages select{padding:3px 4px;font-size:11.5px;border-radius:8px;flex:1;min-width:0}
.g-min{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.g-min input{width:46px;padding:3px 4px;font-size:11.5px;border-radius:8px}
.g-ligne .g-act{grid-column:1/4;display:flex;justify-content:flex-end;gap:0}
.g-act .btn.rond{width:28px;height:28px}
.g-act svg{width:13px;height:13px}
.g-ligne.drag,.mb-carte.drag{opacity:.35}
.g-ligne.cible,.mb-carte.cible{box-shadow:0 -3px 0 var(--canard)}
.g-nouveau{width:100%;margin-top:6px;border-style:dashed}
.g-origine{display:block;margin:6px auto 0;font-weight:600;color:var(--muted)}
.mb-carte{background:var(--plein);border:1px solid var(--line);border-radius:16px}
.mb-carte summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px}
.mb-carte summary::-webkit-details-marker{display:none}
.mb-carte .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.mb-carte .txt{flex:1;min-width:0}
.mb-carte .txt b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-carte .txt small{display:block;font-size:12px;color:var(--muted)}
.mb-carte .g-act{display:flex;flex:none}
.mb-carte[open]{box-shadow:0 0 0 2px var(--peri-deep)}
.mb-corps{padding:4px 16px 8px;border-top:1px solid var(--line);padding-top:14px}
.mb-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 12px}
.mb-page{gap:8px}
@media(max-width:560px){.mb-carte .g-act .btn.rond{width:26px;height:26px}.mb-carte .ic{display:none}}

/* ——— Préparer ——— */
.edit-haut{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:58px}
.edit-haut .titre-seance{flex:1;min-width:180px;font-family:var(--serif);font-size:23px;color:var(--peri-darker);border:none;background:transparent;padding:4px 2px;border-bottom:1.5px dashed transparent;border-radius:0}
.edit-haut .titre-seance:hover,.edit-haut .titre-seance:focus{border-bottom-color:var(--line-bleu);box-shadow:none}
.edit-infos{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.edit-infos select,.edit-infos input{width:auto;padding:6px 9px;font-size:13px;border-radius:10px}
.jauge-chip{font-size:12.5px;font-weight:800;border-radius:999px;padding:6px 12px}
.edit-texte{flex:1;display:flex;flex-direction:column;padding:22px 6% 20px;min-height:0}
.edit-texte .nom-temps{font-family:var(--serif);font-size:30px;color:var(--peri-darker);border:none;background:transparent;padding:2px 0;margin:8px 0 14px;border-radius:0;border-bottom:1.5px dashed transparent}
.edit-texte .nom-temps:hover,.edit-texte .nom-temps:focus{border-bottom-color:var(--line-bleu);box-shadow:none}
.edit-texte textarea.texte{flex:1;min-height:260px;font-family:var(--serif);font-size:24px;line-height:1.75;border:none;background:var(--carte);border-radius:22px;padding:24px 28px;resize:none;box-shadow:var(--ombre)}
.edit-texte .note{font-size:12.5px;color:var(--muted);margin-top:10px}
.panneau-titre{font-family:var(--serif);font-size:19px;color:var(--peri-darker);margin:0 0 14px}
.sect{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.actions-temps{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:12px}
.actions-temps .btn{justify-content:flex-start}
.retour-mobile{display:none}

/* ——— Guider ——— */
.guide{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden}
.g-haut{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line)}
.g-haut .t{font-family:var(--serif);font-size:18px;color:var(--peri-darker);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.g-horaire{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.g-horaire b{color:var(--ink)}
.ecart-ok{background:var(--ok-pale);color:#2c6e53}.ecart-retard{background:var(--attente-pale);color:#8a5418}.ecart-avance{background:var(--info-pale);color:#2e5f94}
body.nuit .ecart-ok,body.nuit .ecart-retard,body.nuit .ecart-avance{background:var(--violet-soft);color:var(--ink)}
.g-prog{padding:8px 16px 0}
.g-main{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;grid-template-rows:minmax(0,1fr);min-height:0;overflow:hidden}
.g-texte-haut{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 7% 0}
.g-texte-haut .nom{font-family:var(--serif);font-size:20px;color:var(--peri-darker);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-texte{flex:1;min-height:0;overflow:auto;font-family:var(--serif);font-size:var(--taille);line-height:1.75;white-space:pre-wrap;padding:6vh 7% 55vh;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent,#000 3%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 3%,#000 86%,transparent)}
.g-texte::-webkit-scrollbar{display:none}
.g-texte.vide{color:var(--muted);font-style:italic}
.g-ici{position:absolute;left:5%;right:5%;top:34%;height:1px;background:rgba(44,122,135,.22);pointer-events:none}
.g-ici::after{content:"ICI";position:absolute;right:0;top:-14px;font-size:9px;font-weight:800;color:var(--canard)}
.g-suggest{padding:0 7%}
.suggestion{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--attente-pale);border:1px solid rgba(224,145,63,.35);color:#6e4412;border-radius:16px;padding:10px 12px;font-size:13px;margin-top:12px;animation:entre .35s ease}
body.nuit .suggestion{background:#2e2517;color:#e9c79f;border-color:#5a4526}
.suggestion span{flex:1;min-width:200px}
.fin-seance{margin-top:12px;background:var(--carte);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.o-chrono .reste.libre{font-family:var(--serif);font-weight:400;font-size:48px;letter-spacing:0}
.o-chrono .reste{font-size:62px;font-weight:800;color:var(--canard);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.o-chrono .reste.depasse{color:var(--attente)}
.o-chrono .o-ligne{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.o-chrono .seance{font-size:15px;font-weight:800;color:var(--ecorce);font-variant-numeric:tabular-nums;text-align:right}
.o-chrono small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.o-barre{height:6px;border-radius:999px;background:var(--violet-soft);margin:12px 0 4px;overflow:hidden}
.o-barre i{display:block;height:100%;background:linear-gradient(90deg,var(--canard),var(--violet));border-radius:999px}
.o-infos{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.o-infos .chip{background:var(--violet-soft);color:var(--peri-darker)}
.o-replie{margin-top:14px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.o-replie summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;opacity:.75}
.o-replie summary::-webkit-details-marker{display:none}
.o-replie summary:hover{opacity:1;background:var(--violet-soft)}
.o-replie summary svg{width:14px;height:14px}
.o-replie .fleche{font-style:normal;transition:transform .2s}
.o-replie[open] .fleche{transform:rotate(90deg)}
.o-replie[open]{background:var(--carte);border:1px solid var(--line);border-radius:16px;padding:8px 12px 12px}
.o-carte{background:var(--carte);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:14px}
.o-repere{font-size:13.5px;line-height:1.6;color:var(--muted);margin-top:6px}
.g-bas{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:10px 16px 12px;border-top:1px solid var(--line)}
.g-suivant{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:9px;min-width:0}
.g-suivant .p{width:10px;height:10px;border-radius:3px;flex:none}
.g-suivant span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-suivant b{color:var(--ink)}
.g-ctrl{display:flex;gap:10px;align-items:center}
.g-ctrl button{height:58px;min-width:64px;border-radius:999px;border:1px solid var(--line-bleu);background:var(--plein);color:var(--peri-darker);font-size:26px;display:grid;place-items:center}
.g-ctrl .go{min-width:210px;background:var(--peri-deep);border-color:var(--peri-deep);color:#fff;font-size:17px;font-weight:800;box-shadow:0 14px 28px -16px rgba(74,63,143,.9)}
.g-ctrl .go.pause{background:var(--canard);border-color:var(--canard)}
body.nuit .g-ctrl .go.pause{color:#10202a}
.g-bas .droite{display:flex;justify-content:flex-end;gap:8px}
.guide.signal::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;animation:signal 2.6s ease-out}
@keyframes signal{0%{box-shadow:inset 0 0 0 0 rgba(183,155,217,0)}25%{box-shadow:inset 0 0 70px 20px rgba(183,155,217,.55)}100%{box-shadow:inset 0 0 0 0 rgba(183,155,217,0)}}
.tiroir-fond{display:none}

/* ——— Bâton de pluie ——— */
.baton svg{width:100%;height:auto;overflow:visible}
.baton .etiquette{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px}
.baton .phase{font-family:var(--serif);font-size:30px;transition:color .4s}
.baton .phase.in{color:var(--canard)}.baton .phase.ex{color:var(--peri-deep)}
.baton .sec{font-size:26px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.baton .cote{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:-4px}
.reglage-souffle{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.reglage-souffle .champ{margin:0}
.reglage-souffle .pas{gap:4px}
.reglage-souffle .pas b{min-width:38px;font-size:14px}
.reglage-souffle .pas .btn{width:32px;height:32px}
.prereglages{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.prereglages button{border:1px solid var(--line-bleu);background:var(--plein);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--canard-dark)}
.prereglages button.on{background:var(--canard);border-color:var(--canard);color:#fff}
.rythme-calc{font-size:12.5px;color:var(--muted);margin-top:8px}
.rythme-calc b{color:var(--ink)}
.vague svg{width:100%;height:64px}
.pouls{width:74px;height:74px;border-radius:50%;background:var(--t-instrument-f);opacity:.25;margin:12px auto}
.fin-rappel{display:flex;gap:10px;align-items:center;font-size:14px;margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--violet-soft)}
.fin-rappel.imminent{animation:lueur 1.6s ease-in-out infinite}
@keyframes lueur{50%{box-shadow:0 0 0 4px rgba(183,155,217,.45)}}

.g-zone{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.g-visuel{display:flex;justify-content:center;padding:6px 7% 0}
.g-visuel:empty{display:none}
.g-visuel .baton,.g-visuel .vague,.g-visuel .pouls-zone{width:min(720px,100%)}
.g-visuel:not(:empty) + .g-zone .g-texte{padding-top:2vh}
.g-visuel:not(:empty) + .g-zone .g-ici{top:24%}
.baton.grand,.g-visuel .vague{display:grid;grid-template-columns:minmax(0,1fr) 170px;column-gap:18px;align-items:center}
.baton.grand svg,.g-visuel .vague svg{grid-column:1;grid-row:1}
.baton.grand .cote,.g-visuel .vague .aide-lbl{grid-column:1;grid-row:2}
.baton.grand .etiquette,.g-visuel .vague .etiquette{grid-column:2;grid-row:1 / span 2;flex-direction:column;align-items:flex-start;gap:0}
.baton.grand svg{max-height:128px}
.baton.grand .phase,.vague .phase{font-size:34px;line-height:1.1}
.baton.grand .sec,.vague .sec{font-size:30px}
.vague svg{width:100%;height:110px;display:block;border-radius:14px;background:linear-gradient(#eef6fb,#f6f1fb)}
body.nuit .vague svg{background:linear-gradient(#18222b,#1d1a2a)}
.vague .etiquette{display:flex;justify-content:space-between;align-items:baseline}
.vague .phase{font-family:var(--serif);transition:color .4s}.vague .phase.in{color:var(--canard)}.vague .phase.ex{color:var(--peri-deep)}
.vague .sec{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.e-visuel .vague svg{height:80px}.e-visuel .vague .phase{font-size:24px}.e-visuel .vague .sec{font-size:22px}
@media(max-height:780px){.baton.grand svg{max-height:96px}.g-visuel .vague svg{height:92px}.baton.grand .phase,.g-visuel .vague .phase{font-size:28px}.g-texte{font-size:calc(var(--taille) * .9)}}
.e-visuel{display:flex;justify-content:center;margin:-4px 0 14px}
.e-visuel .baton,.e-visuel .vague,.e-visuel .pouls-zone{width:min(520px,100%)}
.e-visuel .baton svg{max-height:150px}
.aide-lbl{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}
.aide-lbl b{color:var(--ink)}
.pouls-zone .pouls{margin:8px auto}

/* ——— Lecteur de musique ——— */
.lecteur-tete{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;padding:0;cursor:pointer;text-align:left;color:inherit}
.lc-fleche{margin-left:auto;color:var(--muted);font-size:13px}
.lecteur.fort{box-shadow:0 0 0 2px var(--t-musique-f)}
.lecteur select{margin-top:10px}
.lc-temps{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;font-weight:700;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.lc-temps input,.lc-vol input{width:100%;accent-color:var(--canard);padding:0;border:0}
.lc-transport{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:8px}
.lc-transport .btn.rond{width:46px;height:46px;font-size:13px;font-weight:800}
.lc-transport #lc-play{width:58px;height:58px}
.rap{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.rap .pas{margin:0}
.lc-vol{display:grid;grid-template-columns:auto minmax(0,1fr) 46px;gap:8px;align-items:center;margin-top:12px;color:var(--muted)}
.lc-vol b{font-size:13px;text-align:right;color:var(--ink)}
.lc-fondus{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.lc-fondus button{border:1px solid var(--line-bleu);background:var(--plein);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--canard-dark)}
.lc-fondus button.on{background:var(--canard);border-color:var(--canard);color:#fff}
.lc-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.lc-actions .btn{padding:7px 4px;font-size:12px}

/* ——— Bilan ——— */
.carte{background:var(--carte);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--ombre)}
.carte + .carte{margin-top:12px}
.bi{display:grid;grid-template-columns:4px minmax(0,1fr) 64px 64px 84px 24px;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.bi:last-child{border-bottom:0}
.bi .b{align-self:stretch;border-radius:4px;opacity:.75}
.bi.tete{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bi input{width:18px;height:18px;accent-color:var(--canard);margin:0}
.ecart{font-weight:800;font-size:12px;border-radius:999px;padding:3px 9px;text-align:center}
@media(max-width:560px){.bi{grid-template-columns:4px 1fr 50px 50px 64px 20px;gap:6px;font-size:12.5px}}
.bilan-item{background:var(--carte);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.bilan-item + .bilan-item{margin-top:10px}
.bilan-item summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.bilan-item summary::-webkit-details-marker{display:none}
.bilan-item h4{margin:0;font-family:var(--serif);font-weight:400;font-size:19px;color:var(--peri-darker)}
.bilan-item .note{font-size:13.5px;color:var(--muted);font-style:italic;margin-top:8px;line-height:1.55}
.ligne{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;background:var(--plein);border:1px solid var(--line)}
.ligne + .ligne{margin-top:8px}
.ligne .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.ligne .txt{flex:1;min-width:0}
.ligne .txt input{border:none;background:transparent;padding:2px 0;font-weight:700;font-size:14.5px;box-shadow:none}
.ligne .txt small{display:block;font-size:12px;color:var(--muted)}
.info-bloc{display:flex;gap:10px;align-items:flex-start;background:var(--aqua-pale);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.55;color:var(--canard-dark);margin-bottom:14px}

/* ——— Écrans plus étroits ——— */
@media(max-width:1100px){
  .espace{grid-template-columns:220px minmax(0,1fr) 280px}
  .g-main{grid-template-columns:minmax(0,1fr) 300px}
  .g-main .col-temps{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:60;background:var(--fond);box-shadow:20px 0 50px -20px rgba(0,0,0,.35);transform:translateX(-105%);transition:transform .3s}
  .guide.tiroir .g-main .col-temps{transform:none}
  .guide.tiroir .tiroir-fond{display:block;position:fixed;inset:0;z-index:55;background:rgba(20,18,30,.35)}
}
@media(min-width:1101px){.bouton-tiroir{display:none!important}}
@media(max-width:820px){
  /* Préparer : la liste d’abord, puis le temps choisi en plein écran */
  .espace{grid-template-columns:1fr;height:auto;min-height:0}
  .espace .col{overflow:visible}
  .espace .col-temps{border-right:0}
  .espace.detail .col-temps{display:none}
  .espace:not(.detail) .col-centre,.espace:not(.detail) .col-outils{display:none}
  .espace .col-outils{border-left:0;border-top:1px solid var(--line)}
  .edit-texte{padding:16px 16px}
  .edit-texte textarea.texte{min-height:320px;font-size:21px;padding:18px}
  .retour-mobile{display:inline-flex}
  /* Guider : le texte au centre, les outils en bande sous le texte */
  .g-main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .g-haut{gap:4px;padding:6px 10px}.g-haut .btn.s{padding:6px 10px}
  .baton.grand,.g-visuel .vague{grid-template-columns:minmax(0,1fr) 110px;column-gap:10px}.g-visuel .baton svg{max-height:84px}.g-visuel .vague svg{height:62px}.g-visuel .vague .phase{font-size:22px}.baton.grand .phase{font-size:26px}.baton.grand .sec{font-size:24px}.g-main .prereglages,.g-main .rythme-calc,.g-main #b-recaler{display:none}
  .g-main .col-outils{border-left:0;border-top:1px solid var(--line);max-height:36vh;padding:10px 14px}
  .o-chrono{display:none}
  .g-mobile{display:flex!important}
  .g-texte{padding:3vh 18px 45vh;font-size:calc(var(--taille) * .8)}
  .g-texte-haut{display:none}
  .g-horaire .obj{display:none}
  .g-bas{grid-template-columns:minmax(0,1fr);gap:8px;padding:8px 12px 10px}
  .g-ctrl button{height:52px;min-width:56px}
  .g-bas .g-suivant{justify-content:center}
  .g-bas .droite{display:none}
  .g-ctrl{justify-content:center}.g-ctrl .go{min-width:0;flex:1}
  .baton .phase{font-size:24px}
}
.g-mobile{display:none;align-items:flex-end;justify-content:space-between;gap:10px;padding:10px 16px 0}
.g-mobile .nom{font-family:var(--serif);font-size:19px;color:var(--peri-darker);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-mobile .reste{font-size:34px;font-weight:800;color:var(--canard);font-variant-numeric:tabular-nums;line-height:1}

/* ——— Synchronisation ——— */
.sync{border:1px solid var(--line);background:var(--plein);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync:empty{display:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--ok)}.sync.encours i{background:var(--info);animation:pouls 1s infinite}
.sync.attente i,.sync.horsligne i{background:var(--attente)}.sync.erreur i,.sync.refuse i{background:var(--alerte)}
.sync.compte{color:var(--peri-deep);border-color:var(--violet)}.sync.compte i{background:var(--violet)}
@keyframes pouls{50%{opacity:.3}}
@media(max-width:760px){.sync:not(.compte) span{display:none}.sync{padding:8px 10px}}
/* Enregistrement */
.g-souris{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--canard-dark);background:var(--aqua-pale);border-radius:999px;padding:5px 10px;white-space:nowrap}
.g-souris.cache{display:none}
.guide.mode-souris .g-main{cursor:pointer}
.guide .g-texte{cursor:grab}.guide.glisse,.guide.glisse *{cursor:grabbing!important;user-select:none}
.aide-souris{line-height:1.55;font-size:12.5px}
.aide-souris svg{display:inline-block;vertical-align:-3px}
@media(max-width:560px){.g-souris span{display:none}.g-souris{padding:5px 7px}}
.g-enr{gap:6px;color:var(--alerte);border-color:transparent;background:transparent}
.g-enr .pt,.pt-rouge{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--alerte);flex:none}
.pt-rouge{background:#fff}
.g-enr.actif{background:var(--alerte);color:#fff;font-variant-numeric:tabular-nums}
.g-enr.actif .pt{background:#fff;animation:clignote 1.2s infinite}
.g-enr.en-pause{background:var(--attente-pale);color:#8a5a14}.g-enr.en-pause .pt{background:#8a5a14;animation:none}
.g-enr .niv{width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.g-enr .niv b{display:block;height:100%;width:0;background:#fff;transition:width .15s}
.g-enr .lbl{font-weight:700}
@keyframes clignote{50%{opacity:.25}}
@media(max-width:820px){.g-enr .lbl,.g-enr .niv{display:none}}
@media(max-width:560px){.g-haut .g-horaire>span:first-child{display:none}.g-haut .g-enr{padding:6px 8px}.g-haut .btn.rond{width:34px;height:34px}}
.enr-fen{max-width:470px;max-height:calc(100dvh - 36px);overflow:auto}
.son-choix{background:var(--carte);border:1px solid var(--line);border-radius:16px;padding:12px 14px 10px;margin:4px 0 12px}
.son-choix .champ{margin-bottom:8px}
.son-choix .champ svg{display:inline-block;vertical-align:-3px;margin-right:3px}
.son-niv{height:6px;border-radius:3px;background:var(--violet-soft);overflow:hidden;margin:-2px 0 12px}
.son-niv b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--canard),var(--ok));transition:width .08s}
.son-niv.muet{background:var(--attente-pale)}
.son-auto-v{font-weight:600;color:var(--muted);font-size:11.5px;margin-left:4px}
.son-gain b{color:var(--canard-dark);margin-left:4px}
.son-gain input{width:100%;accent-color:var(--canard);margin:6px 0 2px}

let dbP=null;const blobsMem=new Map();
function idb(){if(!dbP)dbP=new Promise((res,rej)=>{try{const r=indexedDB.open('regie-etre',1);r.onupgradeneeded=()=>r.result.createObjectStore('musiques');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbP}
async function idbPut(id,blob){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('musiques','readwrite');tx.objectStore('musiques').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){blobsMem.set(id,blob)}}
async function idbGet(id){if(blobsMem.has(id))return blobsMem.get(id);try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction('musiques').objectStore('musiques').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch(e){return null}}
async function idbDel(id){blobsMem.delete(id);try{const db=await idb();db.transaction('musiques','readwrite').objectStore('musiques').delete(id)}catch(e){}}

// La clé Gemini : celle saisie ici, sinon celle de l'appli Suivi de l'Être (même appareil ou même compte).
async function cleGemini(demander){
  if(D.prefs.cleGemini)return D.prefs.cleGemini;
  if(!COMPTE){
    try{const p=JSON.parse(localStorage.getItem('mac_parametres')||'{}');if(p.geminiKey)return p.geminiKey}catch(e){}
    try{const j=await jetonValide();if(j){const r=await sb('sync?id=eq.1&select=cle:parametres->>geminiKey',{},j);if(r.ok){const d=await r.json();if(d[0]&&d[0].cle)return d[0].cle}}}catch(e){}
  }
  if(!demander)return '';

const GEMINI_MODELES=['gemini-flash-latest','gemini-flash-lite-latest','gemini-2.5-flash','gemini-2.5-flash-lite'];
// Le palier gratuit répond souvent « surchargé » sur un modèle quand un autre marche : on passe au suivant.
async function gemini(parts,cle,json){
  let derniere=null;
  for(let tour=0;tour<2;tour++){
    if(tour)await new Promise(r=>setTimeout(r,4000));
    for(const m of GEMINI_MODELES){
      let res;
      try{res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(cle)}`,{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({contents:[{parts}],generationConfig:json?{responseMimeType:'application/json',temperature:.3}:{temperature:.2}})})}
      catch(e){derniere=Object.assign(new Error('Pas de connexion internet pour l’instant.'),{reseau:true});continue}
      if(res.ok){const d=await res.json().catch(()=>null);const t=((d&&d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||'').join('').trim();if(t)return t;derniere=new Error('Réponse vide de l’IA.');continue}
      const det=await res.text().catch(()=>'');derniere=Object.assign(new Error(`Erreur de l’IA (${res.status})`),{status:res.status,detail:det});
      if([404,429,500,503].includes(res.status))continue;
      throw derniere;
    }
  }
  throw derniere||new Error('Erreur inconnue.');
}
function messageGemini(e){
  const s=e&&e.status;
  if(e&&e.reseau)return 'Pas de connexion internet pour l’instant : la dictée est gardée, elle sera rangée dès que le réseau revient.';
  if(s===503||s===500)return 'L’IA de Google est surchargée en ce moment. La dictée est gardée : réessayez dans quelques minutes.';
  if(s===429)return 'Trop de demandes à l’IA (palier gratuit). La dictée est gardée : réessayez dans une minute.';
  if((s===400||s===403)&&/api key|api_key|permission/i.test(e.detail||''))return 'Google refuse la clé Gemini. Vérifiez-la (Mes séances → dictées → « Changer la clé »).';
  return (e&&e.message)||'Erreur inconnue.';
}
const CONSIGNE_SEANCE=`Tu aides un praticien (hypnose, sophrologie, relaxation, méditation) à préparer une séance guidée dans sa « régie ». Il a dicté ses idées à voix haute.
Fais-en une séance structurée, découpée en « temps ». Réponds UNIQUEMENT avec ce JSON :
{"transcription":"…","titre":"…","genre":"atelier|individuel|autre","temps":[{"type":"parole|instrument|musique|silence|transition|partage","nom":"titre court","min":5,"libre":false,"texte":"…","repere":"…","position":"allonge|cote|assis|debout|","instrument":"pluie|ocean|flute|carillon|tambour|","fin":"|carillon|bol|flute"}]}
Règles :
- "transcription" : ce qu'il a dit, fidèlement, en français, sans les hésitations.
- Garde son ordre et ses mots. N'invente aucun contenu : tu peux seulement découper, donner des titres courts et estimer les durées qu'il n'a pas dites.
- "texte" : ce qu'il dira pendant ce temps, rédigé proprement à partir de ses mots (paragraphes séparés par une ligne vide). Vide pour une musique ou un silence sans consigne.
- "repere" : ses notes pour lui-même (« penser à… », matériel, intention). Sinon vide.
- "type" : parole (il parle), instrument (bâton de pluie, tambour océan, flûte, carillon, tambour), musique (un morceau), silence, transition (retour, mise en mouvement), partage (échange, tour de parole).
- "min" : minutes entières ; "libre" vrai seulement s'il dit que la durée est libre.
- "genre" : atelier (groupe), individuel (une personne), sinon autre. "titre" : court, à partir de ce qu'il dit.`;
// La réponse de l'IA devient une séance de la régie (types, durées, positions… vérifiés).
function seanceDepuisIA(r){
  const un=(v,liste)=>liste.includes(v)?v:null;
  const temps=(Array.isArray(r.temps)?r.temps:[]).filter(t=>t&&TYPES[t.type]).map(t=>{
    const o=optionsType(t.type);
    const inst=t.type==='instrument'?un(t.instrument,Object.keys(INSTR)):null;
    if(inst){o.instrument=inst;o.rythme={pluie:5,ocean:8,tambour:60}[inst]||null;o.expire=inst==='pluie'?5:null}
    if(t.type==='silence'&&t.fin!=null&&t.fin in FINS)o.fin=t.fin;
    const min=Math.min(120,Math.max(1,Math.round(+t.min)||5));
    return nb(t.type,String(t.nom||TYPES[t.type].nom).slice(0,80),min,Object.assign(o,{texte:String(t.texte||''),repere:String(t.repere||''),position:un(t.position,Object.keys(POS)),libre:!!t.libre}));
  });
  return {id:uid(),titre:String(r.titre||'Séance dictée').slice(0,80),genre:un(r.genre,Object.keys(KIND))||'atelier',debut:'',finH:'',blocs:temps.length?temps:[nb('parole','Ma dictée',5,{texte:String(r.transcription||'')})]};
}
const lireJSON=t=>{try{return JSON.parse(t)}catch(e){const m=String(t).match(/\{[\s\S]*\}/);return m?JSON.parse(m[0]):null}};
const enBase64=blob=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(',')[1]);f.onerror=rej;f.readAsDataURL(blob)});
// Ranger une dictée (texte ou audio) : renvoie {transcription, seance}.
async function rangerDictee(d,cle){
  const parts=[];
  if(d.texte)parts.push({text:CONSIGNE_SEANCE+'\n\nSa dictée (transcription automatique) :\n"""\n'+d.texte+'\n"""'});
  else{const blob=await idbGet(d.id);if(!blob)throw new Error('Le son de cette dictée est introuvable sur cet appareil.');
    parts.push({inline_data:{mime_type:'audio/mp3',data:await enBase64(blob)}},{text:CONSIGNE_SEANCE+'\n\nSa dictée est dans le fichier audio joint.'})}
  const r=lireJSON(await gemini(parts,cle,true));
  if(!r)throw new Error('La réponse de l’IA n’a pas pu être lue. Réessayez.');
  return {transcription:String(r.transcription||d.texte||''),seance:seanceDepuisIA(r)};

// Transcrire seulement (micro d'un temps) : le texte, sans mise en forme.
async function transcrireAudio(blob,cle){
  return gemini([{inline_data:{mime_type:'audio/mp3',data:await enBase64(blob)}},{text:'Transcris fidèlement en français ce qui est dit dans cet audio, en enlevant seulement les hésitations (euh, hum). Paragraphes séparés par une ligne vide. Réponds uniquement avec le texte.'}],cle,false);

// Le dictaphone : la voix seule, en mono, compressée (MP3 léger) et gardée au fur et à mesure.
async function creerDictaphone(id){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Ce téléphone ne permet pas d’enregistrer ici.');
  await chargerLame();
  if(!audioInit())throw new Error('Le son n’est pas disponible sur cet appareil.');
  await A.ctx.resume();
  // Ici on veut une voix nette malgré la route : on laisse le téléphone réduire le bruit.
  const flux=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const ctx=A.ctx,mic=ctx.createMediaStreamSource(flux),ana=ctx.createAnalyser(),muet=ctx.createGain();muet.gain.value=0;ana.fftSize=1024;
  const enc=new lamejs.Mp3Encoder(1,ctx.sampleRate,32);let parts=[],ms=0,actif=true;
  const proc=await capteur(ctx,g0=>{
    if(!actif)return;
    const g=new Int16Array(g0.length);for(let i=0;i<g0.length;i++){const v=Math.max(-1,Math.min(1,g0[i]));g[i]=v<0?v*32768:v*32767}
    for(let i=0;i<g.length;i+=1152){const b=enc.encodeBuffer(g.subarray(i,i+1152));if(b.length)parts.push(new Uint8Array(b))}
    ms+=g0.length/ctx.sampleRate*1000;
  });

  const tg=setInterval(()=>{if(actif)idbPut(id,blob())},15000);
  const fermer=()=>{clearInterval(tg);proc.arreter();flux.getTracks().forEach(t=>t.stop());[mic,ana,proc,muet].forEach(n=>{try{n.disconnect()}catch(e){}})};

    duree:()=>ms,pause(){actif=false},reprendre(){actif=true},
    niveau(){const d=new Uint8Array(ana.fftSize);ana.getByteTimeDomainData(d);let m=0;for(let i=0;i<d.length;i++){const v=Math.abs(d[i]-128);if(v>m)m=v}return Math.min(1,m/90)},

    annuler(){actif=false;fermer();idbDel(id)}

}

    <div class="d-actions"><button class="btn danger" data-r="suppr">${IC.poubelle}</button><button class="btn" data-r="plus-tard">Plus tard</button><button class="btn p" data-r="creer">${IC.check} Créer la séance</button></div>
  </div>`;
  document.body.appendChild(v);

    if(e.target===v){v.remove();return}

  };
}

function brancherDictees(){
  $$('[data-dt-relire]').forEach(b=>b.onclick=()=>relireDictee(b.dataset.dtRelire));
  $$('[data-dt-suppr]').forEach(b=>b.onclick=async()=>{if(confirm('Supprimer cette dictée ?')){await oublierDictee(b.dataset.dtSuppr);vueSeances()}});
  $$('[data-dt-ranger]').forEach(b=>b.onclick=async()=>{
    const d=dictees().find(x=>x.id===b.dataset.dtRanger);if(!d)return;
    if(!navigator.onLine)return toast('Pas de réseau pour le moment : elle sera rangée dès qu’il revient');

    b.disabled=true;b.textContent='…';majDictee(d.id,{etat:'encours',depuis:Date.now()});
    try{const r=await rangerDictee(d,cle);majDictee(d.id,{etat:'prete',transcription:r.transcription,seance:r.seance});relireDictee(d.id)}
    catch(e){majDictee(d.id,e.reseau||[429,500,503].includes(e.status)?{etat:'attente'}:{etat:'erreur',erreur:messageGemini(e)});toast(esc(messageGemini(e)))}

  });

}

// Réglages par défaut d'un nouveau temps selon son type.
function optionsType(t){return t==='instrument'?{instrument:'pluie',rythme:5,expire:5}:t==='silence'?{fin:'carillon'}:{}}
function boutonsTouches(){delete D.boutonsVierges}
// Une ligne de gestion (renommer, monter, descendre, dupliquer, supprimer), glissable.
function ligneGestion(x,i,n,quoi,extra){
  return `<div class="g-ligne" data-${quoi}="${i}" draggable="true">
    <span class="poignee" title="Glisser pour déplacer">⋮⋮</span><span class="b f-${x.type}"></span>

      <button class="btn rond nu" data-g="bas" title="Descendre" ${i===n-1?'disabled':''}>${IC.bas}</button>
      <button class="btn rond nu" data-g="dup" title="Dupliquer">${IC.copie}</button>
      ${quoi==='mb'?`<button class="btn rond nu" data-g="modif" title="Modifier en détail">${IC.edit}</button>`:''}
      <button class="btn rond nu danger" data-g="suppr" title="Supprimer">${IC.poubelle}</button>
    </div></div>`;

// Branche les lignes de gestion d'une liste (tab = D.boutons ou D.mesBlocs).
function brancherGestion(zone,quoi,tab,redessiner,touche){
  let dI=null;
  zone.querySelectorAll(`[data-${quoi}]`).forEach(el=>{
    const i=+el.dataset[quoi],x=tab()[i];
    const fini=()=>{touche&&touche();sauver();redessiner()};
    el.querySelector('[data-nom]').oninput=e=>{x.nom=e.target.value;touche&&touche();sauverBientot()};
    el.querySelectorAll('[data-champ]').forEach(f=>f.onchange=()=>{const k=f.dataset.champ;x[k]=k==='min'?clamp(+f.value||1,1,180):f.value;if(k==='type')Object.assign(x,optionsType(x.type));fini()});
    el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
      const a=b.dataset.g,t=tab();
      if(a==='haut'&&i>0){t.splice(i,1);t.splice(i-1,0,x)}
      if(a==='bas'&&i<t.length-1){t.splice(i,1);t.splice(i+1,0,x)}
      if(a==='dup'){const c=clone(x);c.id=uid();c.nom+=' (copie)';t.splice(i+1,0,c)}
      if(a==='modif'){aller('blocs',{ouvrir:x.id,retour:S&&S.id});return}
      if(a==='suppr'){if(!confirm(`Supprimer « ${x.nom} » ?`))return;t.splice(i,1)}
      fini();
    });
    // Glisser-déposer, seulement par la poignée (le champ du nom reste sélectionnable).
    const p=el.querySelector('.poignee');
    p.onmousedown=p.ontouchstart=()=>el.draggable=true;
    el.querySelector('[data-nom]').onmousedown=()=>el.draggable=false;
    el.ondragstart=e=>{dI=i;el.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','')}catch(_){}};
    el.ondragend=()=>{dI=null;zone.querySelectorAll('.g-ligne').forEach(z=>z.classList.remove('drag','cible'));el.draggable=true};
    el.ondragover=e=>{if(dI==null)return;e.preventDefault();zone.querySelectorAll('.g-ligne').forEach(z=>z.classList.toggle('cible',z===el))};
    el.ondrop=e=>{e.preventDefault();if(dI==null||dI===i)return;const t=tab();const [m]=t.splice(dI,1);t.splice(i,0,m);dI=null;fini();toast('Déplacé')};
  });
}

function majJauge(){

// Renommer un temps directement dans la liste (Entrée valide, Échap annule).
function renommerTemps(el,b){
  el.classList.add('renomme');el.draggable=false;

  z.outerHTML=`<input type="text" class="ti-nom" value="${esc(b.nom)}" aria-label="Nom du temps">`;
  const f=el.querySelector('.ti-nom');f.focus();f.select();

  f.onclick=e=>e.stopPropagation();
  f.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();finir(true)}if(e.key==='Escape')finir(false)};

/* ——— Le bâton de pluie : il s’incline à gauche puis à droite ——— */
function batonHTML(b,grand){
  const tin=b.rythme||5,tex=b.expire||tin;
  let grains='';for(let k=0;k<16;k++)grains+=`<circle r="2.4" cx="${40+k*14}" cy="${86+(k%3)*3}"/>`;
  let spirale='';for(let x=40;x<262;x+=16)spirale+=`<path d="M${x} 78 l9 22"/>`;
  return `<div class="baton ${grand?'grand':''}" data-bloc="${b.id}" data-in="${tin}" data-ex="${tex}" data-t0="${performance.now()}">
    <svg viewBox="0 34 300 112" role="img" aria-label="Inclinaison du bâton de pluie">
      <path d="M150 104 l-14 24 h28 z" fill="var(--line-bleu)"/><rect x="118" y="127" width="64" height="5" rx="2.5" fill="var(--line-bleu)"/>
      <g class="b-baton">
        <rect x="18" y="76" width="264" height="26" rx="13" fill="#a0734f"/>
        <rect x="18" y="76" width="264" height="10" rx="5" fill="#c49b74" opacity=".75"/>
        <g stroke="#6e4b30" stroke-width="2" opacity=".35">${spirale}</g>

function brancherRythme(el,b,apres){

const rpm=(a,b)=>(60/(a+b)).toFixed(1).replace('.0','').replace('.',',');

// Branche les boutons − / + et les préréglages ; apres(b) enregistre.

    el.querySelectorAll('[data-v=rpm]').forEach(x=>x.textContent=rpm(tin,tex));

    $$(`.baton[data-bloc="${b.id}"]`).forEach(bt=>{bt.dataset.in=tin;bt.dataset.ex=tex});apres&&apres(b)};
  el.querySelectorAll('[data-souffle]').forEach(x=>x.onclick=()=>{const [k,d]=x.dataset.souffle.split(':');if(!b.expire)b.expire=b.rythme||5;if(k==='in')b.rythme=clamp((b.rythme||5)+ +d,2,12);else b.expire=clamp(b.expire+ +d,2,14);maj()});
  el.querySelectorAll('[data-preset]').forEach(x=>x.onclick=()=>{const [a,c]=x.dataset.preset.split(',').map(Number);b.rythme=a;b.expire=c;maj()});
}

const A={ctx:null,el:null,gain:null,url:null,id:null,joue:false,stopT:null};

    A.el.onended=()=>{A.joue=false;majMusique()};appliquerSortie();return true}catch(e){return false}
}
async function charger(id){if(A.id===id&&A.el.src)return true;const blob=await idbGet(id);if(!blob)return false;if(A.url)URL.revokeObjectURL(A.url);A.url=URL.createObjectURL(blob);A.el.src=A.url;A.id=id;return true}

  if(!audioInit())return toast('Le son n’est pas disponible sur cet appareil');
  await A.ctx.resume();clearTimeout(A.stopT);
  if(!(await charger(id)))return toast('Morceau introuvable sur cet appareil : ajoute-le dans « Musiques »');
  if(depuisDebut)A.el.currentTime=0;
  try{await A.el.play()}catch(e){return toast('Touche « Démarrer » pour autoriser le son')}

}
/* ——— Son : quel micro, quelle sortie (écouteurs, enceintes) ———
   Le choix est retenu sur cet appareil (les préférences ne voyagent pas).
   Changer de sortie n'existe que dans Chrome et Edge (pas sur iPhone / iPad). */
const sortiePossible=()=>!!(window.AudioContext&&'setSinkId' in AudioContext.prototype);
function appliquerSortie(){
  if(!A.ctx||!sortiePossible())return;
  A.ctx.setSinkId(D.prefs.sortieId||'').catch(()=>{A.ctx.setSinkId('').catch(()=>{})});
}
// La contrainte micro à demander : celui choisi, sinon celui par défaut.
// L'amplification manuelle du micro (1 = telle quelle, jusqu'à 8 pour un micro faible).
const gainMicro=()=>clamp(+D.prefs.micGain||1,1,8);
const sonBrut=()=>D.prefs.sonBrut===true;
const micAuto=()=>!sonBrut()&&D.prefs.micAuto!==false;
// Réglages conseillés : volume automatique, pas de porte anti-bruit, traitement doux.
function reglagesConseilles(){delete D.prefs.micAuto;D.prefs.antiBruit=false;D.prefs.sonBrut=false;D.prefs.micGain=1;D.prefs.sonV=2;sauverBientot()}
if(D.prefs.sonV!==2)reglagesConseilles();
const antiBruit=()=>D.prefs.antiBruit===true;   // désactivé par défaut : jamais de risque de rogner un mot
/* La voix avant l'enregistrement : coupe des graves inutiles (grondements),
   niveau réglé tout seul (on vise une voix bien présente : il monte doucement
   quand on parle bas, redescend vite quand on parle fort, ne bouge pas dans
   les silences), compression douce pour une voix régulière, puis limiteur. */
// Les chaînes de voix ouvertes (enregistrement, essai du micro) : un clic les fait taire un éclair.
const CHAINES=new Set();
function etoufferClic(){
  CHAINES.forEach(c=>{const g=c.etouffe.gain,t=c.ctx.currentTime;g.cancelScheduledValues(t);g.setTargetAtTime(.08,t,.003);g.setTargetAtTime(1,t+.07,.015)});
}
// Seulement les vrais clics de bouton (pas la roulette ni le clavier, qui ne doivent jamais couper la voix).
['mousedown','mouseup'].forEach(ev=>addEventListener(ev,()=>{if(CHAINES.size)etoufferClic()},{capture:true,passive:true}));
function chaineVoix(ctx){
  // Son brut : la voix passe telle quelle (aucun filtre, aucun réglage, aucun effacement de clic).
  if(sonBrut()){const n=ctx.createGain();n.gain.value=gainMicro();return {entree:n,sortie:n,etouffe:ctx.createGain(),ctx,gain:()=>n.gain.value,regler(v){n.gain.value=v},stop(){try{n.disconnect()}catch(e){}}}}
  // Pas de compresseur du navigateur : il ajoute de lui-même ~+9 dB (gain de compensation) et
  // poussait la voix jusqu'à saturer. Les pointes sont arrondies plus loin, à l'encodage (plafondDoux).
  const hp=ctx.createBiquadFilter(),amp=ctx.createGain(),porte=ctx.createGain(),etouffe=ctx.createGain(),mes=ctx.createAnalyser();
  hp.type='highpass';hp.frequency.value=80;hp.Q.value=.7;
  mes.fftSize=2048;hp.connect(mes);hp.connect(amp);amp.connect(porte);porte.connect(etouffe);
  const auto=micAuto(),nettoie=antiBruit();let g=auto?clamp(+D.prefs.micAutoGain||2,1,8):gainMicro(),bruit=null,calme=0,ouverte=true,niveau=null,parole=0;amp.gain.value=g;
  const d=new Float32Array(mes.fftSize);
  const t=setInterval(()=>{
    mes.getFloatTimeDomainData(d);let q=0;for(let i=0;i<d.length;i++)q+=d[i]*d[i];const rms=Math.sqrt(q/d.length)+1e-6;
    // Le bruit de fond de la pièce : le niveau le plus bas entendu, qui ne remonte que très lentement
    // et jamais au-delà d'une pièce calme (une voix continue ne peut pas être prise pour du bruit).
    bruit=bruit==null?Math.min(rms,.01):Math.min(rms,bruit*1.002,.01);
    const parle=rms>Math.max(.003,bruit*3);              // la voix dépasse le bruit d'environ 10 dB
    // Porte douce (facultative) : entre deux phrases, le bruit ambiant baisse un peu (jamais de trou).
    if(nettoie){calme=parle?0:calme+1;const ouvrir=parle||calme<8;
      if(ouvrir!==ouverte){ouverte=ouvrir;porte.gain.setTargetAtTime(ouvrir?1:.35,ctx.currentTime,ouvrir?.02:.35)}}
    if(!auto||!parle)return;                             // le niveau ne bouge que sur la voix
    // Niveau de la voix lissé sur environ une seconde : on suit la voix, pas chaque syllabe.
    // Aucune chute brutale : un mot fort ne fait plus « disparaître » les suivants.
    // un passage fort isolé (crié, plosive) compte au plus double : c'est le limiteur qui s'en occupe
    niveau=niveau==null?rms:niveau*.88+Math.min(rms,niveau*2)*.12;parole++;
    const voulu=clamp(.1/niveau,1,8);                     // voix visée ≈ −20 dB, amplification ×8 au plus
    const vite=parole<40;                                 // les 4 premières secondes de voix : on se cale
    g=voulu<g?Math.max(voulu,g*(vite?.95:.99)):Math.min(voulu,g*(vite?1.03:1.008));

    stop(){clearInterval(t);CHAINES.delete(ch);[hp,amp,porte,etouffe,mes].forEach(n=>{try{n.disconnect()}catch(e){}});if(auto)sauverBientot()}};
  CHAINES.add(ch);return ch;
}
// Plafond doux : sous −3 dB rien ne change ; au-dessus, la pointe est arrondie sans jamais dépasser 0 dB
// (au lieu d'être coupée net, ce qui s'entend comme une saturation).
const plafondDoux=v=>{const a=v<0?-v:v;if(a<=.7)return v;const y=.7+.3*Math.tanh((a-.7)/.3);return v<0?-y:y};
/* Limiteur à anticipation (−1 dB) : il voit venir chaque pointe 5 ms à l'avance, baisse le son
   en douceur juste ce qu'il faut, puis relâche en ~0,15 s : le mot suivant n'est pas touché.
   Il travaille par paquets (enregistrement, assemblage) et garde son état d'un paquet à l'autre. */
function limiteur(sr){
  const plafond=.89,L=Math.round(sr*.005),att=1-Math.exp(-1/(L/4)),rel=1-Math.exp(-1/(sr*.15));let env=1;
  return (G,Dr)=>{
    const n=G.length,req=new Float32Array(n),mn=new Float32Array(n),q=new Int32Array(n);
    for(let i=0;i<n;i++){const a=Math.max(G[i]<0?-G[i]:G[i],Dr[i]<0?-Dr[i]:Dr[i]);req[i]=a>plafond?plafond/a:1}
    // minimum glissant sur [i, i+L] (file monotone) : le gain baisse avant la pointe
    let h=0,t=0;
    for(let i=n-1;i>=0;i--){while(t>h&&req[q[t-1]]>=req[i])t--;q[t++]=i;while(q[h]>i+L)h++;mn[i]=req[q[h]]}

const contrainteMicro=(o={})=>Object.assign(D.prefs.micId?{deviceId:{exact:D.prefs.micId}}:{},o);

function brancherSon(el){

  };

    aideNiv.innerHTML=m==='micro'?'Tournez le <b>bouton de gain de votre micro</b> en parlant normalement : la barre doit rester dans la <b>zone verte</b>, sans toucher le rouge.':'Parlez : la barre doit bouger. La régie règle le volume toute seule.'};

  return `<div class="dossiers">${puce('*','Tous',D.musiques.length)}${ds.map(x=>puce(x,'📁 '+esc(x),n(x))).join('')}${ds.length&&n('')?puce('','Sans dossier',n('')):''}

function brancherDossiers(){
  $$('[data-dos]').forEach(b=>b.onclick=()=>{D.prefs.dossierMus=b.dataset.dos;sauverBientot();vueMusiques()});
  const garderVide=x=>{const l=new Set(D.prefs.dossiersMus||[]);l.add(x);D.prefs.dossiersMus=[...l]};
  $('#dos-nouveau').onclick=()=>{const x=(prompt('Nom du nouveau dossier :')||'').trim();if(!x)return;garderVide(x);D.prefs.dossierMus=x;sauver();vueMusiques()};
  const r=$('#dos-renommer');if(r)r.onclick=()=>{const a=dossierActif(),x=(prompt('Nouveau nom du dossier :',a)||'').trim();if(!x||x===a)return;
    D.musiques.forEach(m=>{if(m.dossier===a)m.dossier=x});D.prefs.dossiersMus=(D.prefs.dossiersMus||[]).filter(y=>y!==a);garderVide(x);D.prefs.dossierMus=x;sauver();vueMusiques()};
  const s=$('#dos-suppr');if(s)s.onclick=()=>{const a=dossierActif();if(!confirm(`Supprimer le dossier « ${a} » ? Les audios qu’il contient ne sont pas supprimés : ils passent « Sans dossier ».`))return;

}

/* =============================== ENREGISTRER ===============================
   Le micro (et, si demandé, la musique de la régie) est mélangé puis encodé
   en MP3 au fil de l'eau : un fichier lisible partout, à envoyer tel quel.
   Toutes les 20 s, ce qui est enregistré est mis de côté sur l'appareil :
   si la page se ferme, l'enregistrement est retrouvé au lancement suivant. */
const CLE_ENR='regieEtre.enr',ID_ENR='__enregistrement';
let lameP=null;
function chargerLame(){
  if(window.lamejs)return Promise.resolve();
  if(!lameP)lameP=new Promise((res,rej)=>{const x=document.createElement('script');x.src='lame.min.js';x.onload=()=>res();x.onerror=()=>{lameP=null;rej(new Error('encodeur'))};document.head.appendChild(x)});
  return lameP;
}
// Le capteur : un AudioWorklet (fil audio) quand le navigateur le permet, sinon l'ancien ScriptProcessor.
const CAPTEUR_JS=`class Capteur extends AudioWorkletProcessor{
  constructor(){super();this.n=0;this.g=new Float32Array(4096);this.d=new Float32Array(4096);this.port.onmessage=e=>{if(e.data==='vider')this.vider()}}
  vider(){if(!this.n)return;this.port.postMessage([this.g.slice(0,this.n),this.d.slice(0,this.n)]);this.n=0}
  process(inputs){const e=inputs[0];if(e&&e.length){const g=e[0],d=e[1]||e[0];
    for(let i=0;i<g.length;i++){this.g[this.n]=g[i];this.d[this.n]=d[i];this.n++;if(this.n===4096)this.vider()}}return true}
}
registerProcessor('capteur-regie',Capteur);`;
const capteurPret=new WeakMap();
async function capteur(ctx,surPaquet){
  if(ctx.audioWorklet&&window.AudioWorkletNode){
    try{
      if(!capteurPret.get(ctx)){const u=URL.createObjectURL(new Blob([CAPTEUR_JS],{type:'application/javascript'}));await ctx.audioWorklet.addModule(u);capteurPret.set(ctx,true)}
      const n=new AudioWorkletNode(ctx,'capteur-regie',{numberOfInputs:1,numberOfOutputs:1,channelCount:2,channelCountMode:'explicit',outputChannelCount:[2]});
      n.port.onmessage=e=>surPaquet(e.data[0],e.data[1]);
      n.arreter=()=>{try{n.port.postMessage('vider')}catch(e){}n.port.onmessage=null};
      return n;
    }catch(e){}
  }
  const p=ctx.createScriptProcessor(4096,2,2);
  p.onaudioprocess=e=>{const ib=e.inputBuffer;surPaquet(ib.getChannelData(0).slice(),ib.getChannelData(ib.numberOfChannels>1?1:0).slice())};
  p.arreter=()=>{p.onaudioprocess=null};
  return p;
}
// Les 3 premières secondes : silence, pendant que la régie écoute le bruit de la pièce. Elles restent
// au début du fichier ; l'atténuation du bruit s'en sert en priorité pour connaître ce bruit.
async function silenceDebut(){
  if(D.prefs.silenceDebut===false)return;
  const v=document.createElement('div');v.className='voile silence-voile';
  v.innerHTML=`<div class="fenetre" style="text-align:center;max-width:360px"><div class="sil-n" id="sil-n">3</div><h2 style="margin:4px 0 6px">Silence…</h2><p class="sous" style="margin:0">La régie écoute le bruit de la pièce. Ne parlez pas, ne touchez à rien.</p></div>`;
  document.body.appendChild(v);
  for(let k=3;k>0;k--){const n=$('#sil-n');if(n)n.textContent=k;await new Promise(r=>setTimeout(r,1000))}
  v.remove();
}
async function creerEnregistreur(o={}){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Cet appareil ne permet pas d’enregistrer (ouvrez la régie dans Chrome, Edge ou Safari).');
  try{await chargerLame()}catch(e){throw new Error('L’enregistreur n’a pas pu se charger. Vérifiez la connexion et réessayez.')}
  if(!audioInit())throw new Error('Le son n’est pas disponible sur cet appareil.');
  await A.ctx.resume();
  let flux;
  // Ni réduction de bruit ni annulation d'écho du navigateur : sur une voix douce et posée, elles
  // la prennent pour du bruit (ou pour l'écho de la musique) et la coupent net. La régie fait son
  // propre traitement, doux (chaineVoix).
  try{flux=await ouvrirMicro({echoCancellation:false,noiseSuppression:false,autoGainControl:!micAuto()})}
  catch(e){throw new Error('Le micro n’est pas accessible. Autorisez-le dans le navigateur (icône à gauche de l’adresse), puis réessayez.')}
  const ctx=A.ctx,mic=ctx.createMediaStreamSource(flux),mix=ctx.createGain(),ana=ctx.createAnalyser(),muet=ctx.createGain();
  muet.gain.value=0;ana.fftSize=1024;
  const voix=chaineVoix(ctx);
  mic.connect(voix.entree);voix.sortie.connect(mix);
  // Le son tel qu'il arrive du micro : s'il touche déjà le plafond, la saturation vient d'avant la régie
  // (volume d'entrée de Windows trop haut, micro trop près) et ne peut plus être réparée.
  const brut=ctx.createAnalyser();brut.fftSize=2048;mic.connect(brut);
  const db=new Float32Array(brut.fftSize);let satur=0,saturRecent=0;
  const tSat=setInterval(()=>{if(etat!=='enr')return;brut.getFloatTimeDomainData(db);let n=0;for(let i=0;i<db.length;i++)if(db[i]>.985||db[i]<-.985)n++;
    if(n>=3){satur++;saturRecent=performance.now()}},50);if(o.musique&&A.gain)A.gain.connect(mix);
  mix.connect(ana);
  const enc=new lamejs.Mp3Encoder(2,ctx.sampleRate,96),blocs=[];let parts=[],ms=0,etat='pret',pic=0;
  const pcm=f=>{const r=new Int16Array(f.length);for(let i=0;i<f.length;i++){const v=plafondDoux(f[i]);r[i]=v<0?v*32768:v*32767}return r};
  const limiter=limiteur(ctx.sampleRate);
  const encoder=(g0,d0)=>{
    if(etat!=='enr')return;
    for(let i=0;i<g0.length;i+=8){const a=Math.abs(g0[i]);if(a>pic)pic=a}
    if(d0===g0)d0=g0.slice();limiter(g0,d0);
    // L'encodeur abîme le son si on lui donne plus de 1152 échantillons à la fois : on découpe.
    const g=pcm(g0),d=pcm(d0);
    for(let i=0;i<g.length;i+=1152){const b=enc.encodeBuffer(g.subarray(i,i+1152),d.subarray(i,i+1152));if(b.length)parts.push(new Uint8Array(b))}
    ms+=g0.length/ctx.sampleRate*1000;
  };
  // Le son est capté sur le fil audio du navigateur (jamais interrompu), puis confié à la page
  // par paquets : même si la page est occupée un instant, aucun morceau n'est perdu.
  const proc=await capteur(ctx,encoder);mix.connect(proc);proc.connect(muet);muet.connect(ctx.destination);
  const tout=()=>{if(parts.length){blocs.push(new Blob(parts));parts=[]}return new Blob(blocs,{type:'audio/mpeg'})};
  const deCote=()=>{idbPut(ID_ENR,tout());try{localStorage.setItem(CLE_ENR,JSON.stringify({nom:o.nom||'Enregistrement',ms}))}catch(e){}};
  const tg=setInterval(()=>{if(etat==='enr')deCote()},20000);
  const fermer=()=>{clearInterval(tg);clearInterval(tSat);try{brut.disconnect()}catch(e){}proc.arreter();flux.getTracks().forEach(t=>t.stop());voix.stop();[mic,mix,proc,muet].forEach(n=>{try{n.disconnect()}catch(e){}});if(o.musique&&A.gain){try{A.gain.disconnect(mix)}catch(e){}}};
  return {
    nom:o.nom,musique:!!o.musique,get etat(){return etat},duree:()=>ms,
    demarrer(){etat='enr'},pause(){if(etat==='enr')etat='pause'},reprendre(){if(etat==='pause')etat='enr'},
    niveau(){const d=new Uint8Array(ana.fftSize);ana.getByteTimeDomainData(d);let m=0;for(let i=0;i<d.length;i++){const v=Math.abs(d[i]-128);if(v>m)m=v}return Math.min(1,m/100)},
    micro:(flux.getAudioTracks()[0]||{}).label||'',
    sature:()=>performance.now()-saturRecent<1500,saturations:()=>satur,
    arreter(){etat='fini';fermer();const f=enc.flush();if(f.length)parts.push(new Uint8Array(f));const blob=tout();deCote();return {blob,ms,pic,satur}},
    annuler(){etat='fini';fermer();oublierEnr()}
  };
}
function oublierEnr(){idbDel(ID_ENR);try{localStorage.removeItem(CLE_ENR)}catch(e){}}
// Nom de fichier sans accents ni signes spéciaux : il passe partout (e-mail, WhatsApp, Windows…).
const nomFichier=n=>(String(n||'Enregistrement').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[–—]/g,'-').replace(/[\\/:]+/g,'-').replace(/[^\w .()'-]+/g,'').replace(/\s+/g,' ').trim()||'Enregistrement')+'.mp3';
function telecharger(blob,nom){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=nomFichier(nom);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function partager(blob,nom){
  const f=new File([blob],nomFichier(nom),{type:'audio/mpeg'});
  try{await navigator.share({files:[f],title:nom});return true}catch(e){if(e.name!=='AbortError')toast('Le partage n’a pas marché : téléchargez le fichier puis envoyez-le');return false}
}
const peutPartager=blob=>{try{return !!(navigator.canShare&&navigator.canShare({files:[new File([blob],'a.mp3',{type:'audio/mpeg'})]}))}catch(e){return false}};
async function garderMorceau(blob,ms,nom,avecMusique){const id=uid();await idbPut(id,blob);const m={id,nom:nom||'Enregistrement',duree:ms/1000,taille:blob.size,enr:true};if(avecMusique)m.avecMusique=true;D.musiques.push(m);sauver();return m}
// L'enregistrement terminé : l'écouter, le nommer, le télécharger, l'envoyer, le garder.
function fenetreResultat(blob,ms,nom,o={}){
  const v=document.createElement('div');v.className='voile';const u=URL.createObjectURL(blob);let fait=false,garde=null;
  v.innerHTML=`<div class="fenetre enr-fen">
    <h2>${IC.micro} ${o.recupere?'Enregistrement retrouvé':'Votre enregistrement'}</h2>
    <p class="sous" style="margin:0 0 12px">${o.recupere?'Cet enregistrement n’avait pas été terminé. Le voici, tel qu’il a été gardé. ':''}Durée <b>${mmss(ms)}</b> · ${(blob.size/1048576).toFixed(1)} Mo · MP3</p>
    ${o.micro!=null?`<p class="enr-diag">Micro utilisé : <b>${esc(o.micro||'inconnu')}</b> · niveau le plus fort capté : <b>${Math.min(100,Math.round((o.pic||0)*100))} %</b> · ${sonBrut()?'son brut':'traitement doux'} · <span class="enr-version"></span></p>`:''}
    ${o.satur>2?`<div class="info-bloc alerte-bloc">${IC.info}<span><b>Le micro a saturé ${o.satur} fois</b> avant même d’arriver dans la régie : le son est « écrasé » à ces moments-là. Baissez le volume d’entrée du micro dans Windows (Paramètres → Son → Entrée → votre micro, vers 70 %), ou éloignez-vous un peu du micro. La régie remonte toute seule le niveau ensuite.</span></div>`:''}
    ${o.pic!=null&&o.pic<.02?`<div class="info-bloc alerte-bloc">${IC.info}<span><b>Le micro n’a presque rien capté.</b> Vérifiez qu’il n’est pas coupé, rapprochez-vous, ou montez son volume d’entrée dans les réglages de Windows (Son → Entrée).</span></div>`:''}
    <audio class="enr-ecoute" controls src="${u}" style="width:100%;margin-bottom:4px"></audio>
    <label class="ecouter-sur cache">Écouter sur <select id="er-sortie"><option value="">la sortie par défaut</option></select></label>
    <label class="champ">Nom du fichier<input type="text" id="er-nom" value="${esc(nom||'Enregistrement')}"></label>
    <div class="enr-actions">

/* =============================== MONTAGE ===============================
   Assembler un audio : des parties (enregistrements, morceaux, silences) mises
   bout à bout, chacune raccourcie au début ou à la fin si besoin, reliées par un
   fondu doux, avec une musique de fond facultative sous l'ensemble. Le montage
   en cours est gardé sur cet appareil. L'assemblage produit un MP3. */
const montageVide=()=>({parties:[],fond:{ref:null,vol:25},fondu:.4,egaliser:true,debruit:true});
/* Chaque audio est analysé une fois : les blancs techniques du début et de la fin (ajoutés
   par l'encodeur MP3, < −60 dB) sont retirés, et son niveau de voix est mesuré pour égaliser
   les enregistrements entre eux. */
const decodes=new Map(),infos=new Map();
async function decoder(id){
  if(decodes.has(id))return decodes.get(id);
  const b=await idbGet(id);if(!b)throw Object.assign(new Error('absent'),{absent:id});
  audioInit();const buf=await A.ctx.decodeAudioData(await b.arrayBuffer());decodes.set(id,buf);infos.set(id,analyser(buf));return buf;
}
function analyser(buf){
  const d=buf.getChannelData(0),sr=buf.sampleRate,seuil=.001,max=Math.floor(sr*.4);
  let i=0;while(i<Math.min(max,d.length)&&Math.abs(d[i])<seuil)i++;
  let j=d.length-1;while(j>d.length-1-max&&j>i&&Math.abs(d[j])<seuil)j--;
  // niveau de la voix : moyenne des tranches de 50 ms qui ne sont pas du silence
  const w=Math.floor(sr*.05);let q=0,n=0;
  for(let k=i;k+w<=j;k+=w){let e=0;for(let x=k;x<k+w;x++)e+=d[x]*d[x];e=Math.sqrt(e/w);if(e>.006){q+=e*e;n++}}
  return {lead:i/sr,tail:(d.length-1-j)/sr,rms:n?Math.sqrt(q/n):0};
}
const morceau=id=>D.musiques.find(m=>m.id===id);
// Bornes réelles d'une partie audio (blancs techniques retirés).
function bornes(p){
  const tot=p.total||(morceau(p.ref)||{}).duree||0,inf=infos.get(p.ref)||{lead:0,tail:0};
  const deb=Math.max(p.debut||0,inf.lead),fin=Math.min(p.fin??tot,tot-inf.tail);
  return {deb,fin:Math.max(deb,fin),tot};
}
function dureePartie(p){
  if(p.type==='silence')return Math.max(0,+p.duree||0);
  const b=bornes(p);return Math.max(0,b.fin-b.deb);
}
// Volume d'une partie : les enregistrements sont ramenés au même niveau de voix (≈ −20 dB).
function gainPartie(M,p){
  if(p.type!=='audio')return 1;
  const vol=(p.vol??100)/100,m=morceau(p.ref),inf=infos.get(p.ref);       // le curseur de volume de la partie
  if(M.egaliser===false||!m||!m.enr||!inf||!inf.rms)return vol;
  return clamp(.1/inf.rms,.35,4)*vol;
}
// Deux audios qui se suivent se chevauchent : la suivante monte pendant que la précédente s'efface.
function planMontage(M){
  let t=0,prec=null;const f=M.fondu||0;
  const l=M.parties.map(p=>{const d=dureePartie(p);let ov=0;
    if(f>0&&prec&&prec.p.type==='audio'&&p.type==='audio')ov=Math.min(f,prec.d/2,d/2);
    t-=ov;const x={p,t,d,ov,g:gainPartie(M,p)};if(prec)prec.ovFin=ov;t+=d;prec=x;return x});
  l.forEach((x,i)=>{x.fi=x.ov>0?x.ov:(f>0&&x.p.type==='audio'?Math.min(.02,x.d/2):0);x.fo=x.ovFin>0?x.ovFin:(f>0&&x.p.type==='audio'?Math.min(.02,x.d/2):0)});
  return {l,total:Math.max(0,t)};
}
// Courbe « à puissance égale » : pendant le fondu enchaîné, le volume ne creuse pas.
const courbe=(n,monte)=>{const c=new Float32Array(n);for(let i=0;i<n;i++){const u=i/(n-1);c[i]=monte?Math.sin(u*Math.PI/2):Math.cos(u*Math.PI/2)}return c};
/* ——— Atténuer le bruit de fond (ventilateur, souffle) ———
   Après l'enregistrement, jamais pendant : rien ne peut rogner un mot. On mesure le
   bruit régulier de la pièce dans les moments les plus calmes, puis on le retire en
   douceur partout (soustraction spectrale, au plus −18 dB) ; la voix, bien plus
   forte que ce bruit, passe intacte. */
function fftPrep(N){const lv=Math.log2(N),rev=new Uint32Array(N);for(let i=0;i<N;i++){let r=0;for(let b=0;b<lv;b++)r|=((i>>b)&1)<<(lv-1-b);rev[i]=r}
  const cs=new Float64Array(N/2),sn=new Float64Array(N/2);for(let i=0;i<N/2;i++){cs[i]=Math.cos(2*Math.PI*i/N);sn[i]=Math.sin(2*Math.PI*i/N)}return {N,rev,cs,sn}}
function fft(F,re,im,inv){const N=F.N;
  for(let i=0;i<N;i++){const j=F.rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
  for(let size=2;size<=N;size<<=1){const half=size>>1,step=N/size;
    for(let i=0;i<N;i+=size)for(let j=0,k=0;j<half;j++,k+=step){const c=F.cs[k],sn=inv?F.sn[k]:-F.sn[k],a=i+j,b=a+half,tr=re[b]*c-im[b]*sn,ti=re[b]*sn+im[b]*c;re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti}}
  if(inv)for(let i=0;i<N;i++){re[i]/=N;im[i]/=N}}
async function debruiter(buf,surPc){
  const N=1024,H=512,sr=buf.sampleRate,nc=buf.numberOfChannels,len=buf.length,F=fftPrep(N),K=N/2+1;
  const w=new Float32Array(N);for(let i=0;i<N;i++)w[i]=Math.sqrt(.5-.5*Math.cos(2*Math.PI*i/N));
  const out=A.ctx.createBuffer(nc,len,sr);
  // Voix seule : les deux canaux sont identiques, on ne traite qu'une fois.
  const c0=buf.getChannelData(0);let memes=nc===1;
  if(nc>1){const c1=buf.getChannelData(1);memes=true;for(let i=0;i<len;i+=97)if(Math.abs(c0[i]-c1[i])>1e-4){memes=false;break}}
  const canaux=memes?[0]:[...Array(nc).keys()],nbF=Math.ceil(len/H)+1,re=new Float64Array(N),im=new Float64Array(N);
  let fait=0;const totalF=nbF*canaux.length;
  for(const ch of canaux){
    const x=buf.getChannelData(ch),y=new Float32Array(len);
    const trame=s0=>{for(let i=0;i<N;i++){const j=s0+i;re[i]=j>=0&&j<len?x[j]*w[i]:0;im[i]=0}};
    // 1. Le bruit de la pièce : spectre moyen des 10 % de trames les plus calmes (hors silence numérique).
    const en=[];for(let k=0;k<nbF;k++){const s0=k*H-H;let e=0;for(let i=0;i<N;i+=4){const j=s0+i;if(j>=0&&j<len)e+=x[j]*x[j]}if(e>1e-9)en.push([e,k])}
    const debut=en.filter(([,k])=>k*H-H>=sr*.3&&k*H<=sr*2.8);   // le silence du début (après le clic de départ)
    en.sort((a,b)=>a[0]-b[0]);let calmes=en.slice(0,Math.max(10,Math.min(400,Math.floor(en.length*.1))));
    // Si l'enregistrement commence par un vrai silence régulier, c'est lui qui donne le bruit de la pièce.
    if(debut.length>=8){const e=debut.map(([v])=>v).sort((a,b)=>a-b),med=en[en.length>>1][0];
      if(e[e.length-1]<e[0]*6&&e[e.length>>1]*2.5<med){calmes=debut;buf.profilDebut=true}}
    // Garde-fou : s'il n'y a pas de vrais moments calmes (au moins 4 dB sous le niveau habituel, et réguliers),
    // ce « bruit » serait du contenu (musique continue, voix sans pause) : on ne touche à rien.
    // (un ventilateur, lui, est régulier : dans les moments calmes il garde presque toujours la même force)
    {const pc=f=>en.length?en[Math.min(en.length-1,Math.floor(en.length*f))][0]:0,moyC=calmes.reduce((a,[e])=>a+e,0)/Math.max(1,calmes.length);
      if(!en.length||pc(.5)<moyC*2.5||(!buf.profilDebut&&pc(.25)>pc(.05)*4)){surPc&&surPc(100);buf.inchange=true;return buf}}
    const bruit=new Float64Array(K);
