      <div>${a.type==='aide'?'demande de l’aide':a.type==='mot'?esc(a.texte):'a besoin d’un moment'}</div></div>
    <div class="sl-al-b">${a.type!=='mot'?`<button class="btn s" data-aparte="${esc(a.id)}">Aparté</button><button class="btn s nu" data-appel="${esc(a.id)}">Appeler doucement</button>`:''}<button class="btn s nu" data-traite="${a.k}">${a.type==='aide'?'J’y vais':'Lu'}</button></div></div>`;
  const tri=[...gens].sort((a,b)=>{const s=p=>(SALLE.alertes.some(x=>x.id===p.identity&&x.type==='aide')?0:1)+(at(p).main?0:2)+(SALLE.mode==='retour'&&!at(p).ok?0:4);return s(a)-s(b)||String(a.name).localeCompare(String(b.name),'fr')});
  el.innerHTML=`
    <div class="sl-tete"><span class="sl-direct ${etat?'':'on'}"><i></i>${etat||'En direct'}</span><span class="sl-nb">${gens.length} participant${gens.length>1?'s':''}</span>
      <button class="btn rond nu" id="sl-grand" title="${SALLE.grand?'Salle en petit':'Salle en grand'}">${SALLE.grand?'⤡':'⤢'}</button></div>
    <div class="sl-modes">${Object.entries(MODES).map(([k,m])=>`<button class="${SALLE.mode===k?'on':''}" data-mode="${k}" title="${m.aide}">${m.nom}</button>`).join('')}<button class="${SALLE.pause?'on pause':''}" data-mode="pause" title="La salle voit « Petite pause », la musique continue">Pause</button></div>
    <div class="sl-mode-info">${SALLE.manuel?`Mode choisi à la main · <button class="lien" id="sl-auto">revenir à celui du temps</button>`:`Mode du temps : ${MODES[SALLE.mode].aide.toLowerCase()}`}${SALLE.aparte?`<br><b>Aparté en cours</b> avec ${esc((gens.find(p=>p.identity===SALLE.aparte)||{}).name||'')} · <button class="lien" id="sl-fin-aparte">terminer</button>`:''}</div>
    ${SALLE.alertes.length?`<div class="sl-alertes">${SALLE.alertes.map(alerte).join('')}</div>`:''}
    ${SALLE.mode==='retour'&&gens.length?`<div class="sl-retour"><b>Qui est bien revenu ?</b> <span>${ok} / ${gens.length}</span>${pasOk.length?`<div>${pasOk.map(p=>`<span class="sl-pas-ok">${esc(p.name)}<button class="lien" data-appel="${esc(p.identity)}">appeler</button></span>`).join('')}</div>`:'<div style="color:var(--ok)">Tout le monde a répondu « Tout va bien ».</div>'}</div>`:''}
    <div class="sl-grille">${tri.map(p=>{const a=at(p),cam=Track&&p.getTrackPublication(Track.Source.Camera),v=cam&&cam.track&&!cam.isMuted;
      const aide=SALLE.alertes.some(x=>x.id===p.identity&&x.type==='aide');
      return `<div class="sl-tuile ${aide?'aide':''} ${a.main?'main':''} ${SALLE.aparte===p.identity?'aparte':''}" data-p="${esc(p.identity)}">${v?'':`<span class="sl-init">${esc((p.name||'?')[0])}</span>`}
        <span class="sl-nom">${esc(p.name||'')}${a.main?' '+IC_MAIN:''}</span>
        <span class="sl-badges">${SALLE.mode==='retour'||a.ok?(a.ok?'<i class="ok" title="Tout va bien">✓</i>':'<i class="att" title="Pas encore répondu">…</i>'):''}<i title="${a.vu==='tous'?'Visible par tout le groupe':'Visible par vous seulement'}">${a.vu==='tous'||a.ok?'👥':'🔒'}</i></span></div>`}).join('')||`<div class="sl-vide">${etat?'':'La salle est ouverte. Les participants arrivent avec leur lien personnel.'}</div>`}</div>
    <div class="sl-moi">
      <div class="sl-moi-v" id="sl-moi-v">${camOn?'':'<span>Caméra coupée</span>'}</div>
      <div class="sl-moi-b">
        <button class="btn s ${micOn?'':'off'}" id="sl-mic">${micOn?'Micro ouvert':'Micro coupé'}</button>

        <button class="btn s ${SALLE.instruments?'on':''}" id="sl-son" title="Voix : le navigateur nettoie le son. Instruments : le son brut, fidèle.">Son : ${SALLE.instruments?'instruments':'voix'}</button>

      </div>
    </div>
`;

  tri.forEach(p=>{const cam=Track&&p.getTrackPublication(Track.Source.Camera);if(cam&&cam.track&&!cam.isMuted){cam.track.detach();const v=cam.track.attach();v.muted=true;el.querySelector(`.sl-tuile[data-p="${CSS.escape(p.identity)}"]`).prepend(v)}});

  $('#sl-fin-aparte')&&($('#sl-fin-aparte').onclick=()=>aparte(null));
  $$('#g-salle [data-aparte]').forEach(b=>b.onclick=()=>aparte(b.dataset.aparte));
  $$('#g-salle [data-appel]').forEach(b=>b.onclick=()=>{envoyerSalle({t:'appel'},b.dataset.appel);toast('Un son très doux, chez cette personne seulement')});

/* Changer de micro ou de caméra, avant comme pendant la séance. Un appareil
   branché après l'ouverture de la page n'apparaît qu'après « Chercher à
   nouveau » : c'est le navigateur qui garde son ancienne liste. */
/* Le lien d'entrée de la salle en cours : on le demande au serveur des
   rendez-vous, qui le signe. Utile quand quelqu'un a perdu le sien. */
async function fenetreLienSalle(){
  if($('#voile-lien')||!SALLE.atelier)return;
  const a=SALLE.atelier;
  const v=document.createElement('div');v.className='voile';v.id='voile-lien';
  v.innerHTML=`<div class="fenetre">
    <h2>Le lien de la salle</h2>
    <p class="aide">À envoyer à quelqu'un qui n'arrive pas à entrer : la personne écrit son prénom et rejoint la salle. ${a.genre==='atelier'?'Elle entre sans inscription : ne l’envoyez qu’à quelqu’un que vous invitez.':''}</p>
    <div class="lien-boite" id="lien-txt">un instant…</div>
    <div class="actions"><button type="button" class="btn" id="lien-copier">Copier</button><button type="button" class="btn p" id="lien-ok">Fermer</button></div>
  </div>`;
  document.body.appendChild(v);
  const fermer=()=>v.remove();
  $('#lien-ok').onclick=fermer;v.onclick=e=>{if(e.target===v)fermer()};
  const corps=a.genre==='rdv'?{lien:true,demandeId:a.demandeId}
    :a.genre==='agenda'?{lien:true,genre:'rdv',id:a.id}
    :a.genre==='salle'?{lien:true,genre:'salle',id:a.id}
    :{lien:true,genre:'atelier',id:a.id};
  try{
    const jeton=await jetonValide();
    const r=await fetch(`${RDV_API}/api/salle`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${jeton}`},body:JSON.stringify(corps)});
    const j=await r.json();
    if(!j.lien)throw new Error('lien');
    $('#lien-txt').textContent=j.lien;
    $('#lien-copier').onclick=()=>{navigator.clipboard.writeText(j.lien).then(()=>toast('Lien copié'),()=>toast('Copie impossible : sélectionnez le lien'))};
  }catch(e){$('#lien-txt').textContent='Le lien n’a pas pu être préparé (connexion ?).'}
}

async function fenetreAppareils(){
  if($('#voile-appareils'))return;
  const v=document.createElement('div');v.className='voile';v.id='voile-appareils';
  v.innerHTML=`<div class="fenetre">
    <h2>Micro et caméra</h2>
    <label class="champ">Caméra<select id="ap-cam"></select></label>
    <label class="champ">Micro<select id="ap-mic"></select></label>
    <label class="champ cache" id="ap-son-l">Sortie du son<select id="ap-son"></select></label>
    <p class="aide">Le changement est immédiat, même en pleine séance : personne ne sort de la salle. Un appareil que vous venez de brancher n'apparaît qu'après « Chercher à nouveau ».</p>
    <div class="err cache" id="ap-err"></div>
    <div class="actions"><button type="button" class="btn" id="ap-refresh">Chercher à nouveau</button><button type="button" class="btn p" id="ap-ok">Terminé</button></div>
  </div>`;
  document.body.appendChild(v);
  const lister=async()=>{
    try{
      let app=await navigator.mediaDevices.enumerateDevices();
      // Sans autorisation, les appareils n'ont pas de nom : on la demande une fois.
      if(app.some(x=>!x.label)){try{const f=await navigator.mediaDevices.getUserMedia({audio:true,video:true});f.getTracks().forEach(t=>t.stop());app=await navigator.mediaDevices.enumerateDevices()}catch(e){}}
      const opt=(k,sel)=>app.filter(x=>x.kind===k).map((x,i)=>`<option value="${x.deviceId}" ${x.deviceId===sel?'selected':''}>${esc(x.label||((k==='videoinput'?'Caméra ':'Micro ')+(i+1)))}</option>`).join('');
      $('#ap-cam').innerHTML=opt('videoinput',SALLE.camId)||'<option value="">Aucune caméra trouvée</option>';
      $('#ap-mic').innerHTML=opt('audioinput',SALLE.micId)||'<option value="">Aucun micro trouvé</option>';
      // Tous les navigateurs ne savent pas changer de sortie : sinon, on cache.
      const possible=app.some(x=>x.kind==='audiooutput')&&'setSinkId' in HTMLMediaElement.prototype;
      $('#ap-son-l').classList.toggle('cache',!possible);
      if(possible)$('#ap-son').innerHTML=opt('audiooutput',SALLE.sonId);
    }catch(e){}
  };
  await lister();
  const bascule=async(genre,id,quoi)=>{
    if(!SALLE.room)return;
    const x=$('#ap-err');
    try{await SALLE.room.switchActiveDevice(genre,id);x.classList.add('cache')}
    catch(e){x.classList.remove('cache');x.textContent=`Ce ${quoi} n'a pas pu être utilisé : il est peut-être déjà pris par un autre programme.`}
  };
  $('#ap-cam').onchange=e=>{SALLE.camId=e.target.value;bascule('videoinput',e.target.value,'caméra')};
  $('#ap-mic').onchange=e=>{SALLE.micId=e.target.value;bascule('audioinput',e.target.value,'micro')};
  $('#ap-son').onchange=e=>{SALLE.sonId=e.target.value;bascule('audiooutput',e.target.value,'haut-parleur');
    document.querySelectorAll('#sl-sons audio').forEach(a=>{try{a.setSinkId(e.target.value)}catch(x){}})};
  $('#ap-refresh').onclick=lister;
  const fermer=()=>{try{navigator.mediaDevices.ondevicechange=null}catch(e){}v.remove()};
  $('#ap-ok').onclick=fermer;
  v.onclick=e=>{if(e.target===v)fermer()};
  try{navigator.mediaDevices.ondevicechange=lister}catch(e){}
}

/* ================= REPRENDRE L'ANCIENNE RÉGIE (v14) =================
   L'ancienne régie garde la séance chiffrée sur son propre serveur : elle se
   déverrouille avec le nom d'espace et le mot de passe choisis à l'époque.
   Le mot de passe ne quitte jamais cet appareil : seul un code dérivé est
   envoyé, comme le faisait l'ancienne page. Rien n'est modifié là-bas : la
   séance est simplement recopiée ici. */
const V14_URL = 'https://kzviewbnnnzdyocdjtah.supabase.co/functions/v1/regie-sync';
const V14_TYPE = { 0: 'parole', 1: 'instrument', 2: 'instrument', 3: 'musique', 4: 'silence' };
const V14_INSTR = { 1: 'pluie', 2: 'ocean' };
const teB = new TextEncoder(), tdB = new TextDecoder();
const versB64u = o => { let s = ''; for (const b of o) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '') };
const depuisB64u = s => { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const x = atob(s), a = new Uint8Array(x.length); for (let i = 0; i < x.length; i++) a[i] = x.charCodeAt(i); return a };
const sha256 = async o => new Uint8Array(await crypto.subtle.digest('SHA-256', o));
const colle = (...p) => { const r = new Uint8Array(p.reduce((a, x) => a + x.length, 0)); let o = 0; for (const x of p) { r.set(x, o); o += x.length } return r };
async function v14Api(action, payload) {
  const r = await fetch(V14_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, ...payload }) });
  let j = {}; try { j = await r.json() } catch (e) {}
  if (!r.ok) { const e = new Error(j.error || 'http_' + r.status); e.status = r.status; throw e }
  return j;
}
async function v14Ouvrir(nom, motDePasse) {
  const normal = String(nom || '').normalize('NFKC').trim().toLocaleLowerCase('fr-FR').replace(/\s+/g, ' ');
  const empreinte = [...await sha256(teB.encode('regie-user-v1|' + normal))].map(b => b.toString(16).padStart(2, '0')).join('');
  const ch = await v14Api('challenge', { usernameHash: empreinte });
  if (!ch.exists) throw new Error('espace');
  const materiel = await crypto.subtle.importKey('raw', teB.encode(motDePasse), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: depuisB64u(ch.authSalt), iterations: 250000 }, materiel, 512));
  const authKey = bits.slice(0, 32), wrapKey = bits.slice(32, 64);
  const verifieur = versB64u(await sha256(colle(teB.encode('regie-auth-v1|'), authKey)));
  const r = await v14Api('login', { usernameHash: empreinte, authVerifier: verifieur });
  const ouvre = async (cle, iv, ct) => new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: depuisB64u(iv) }, await crypto.subtle.importKey('raw', cle, { name: 'AES-GCM' }, false, ['decrypt']), depuisB64u(ct)));
  const dek = await ouvre(wrapKey, r.passwordBundle.iv, r.passwordBundle.ciphertext);
  if (!r.dataCiphertext) throw new Error('vide');
  const etat = JSON.parse(tdB.decode(await ouvre(dek, r.dataIv, r.dataCiphertext)));
  if (!etat || !Array.isArray(etat.phases) || !etat.phases.length) throw new Error('vide');
  return etat;
}
// « Atelier de méditation — 19h30 à 21h » → titre, début et fin
function v14Seance(etat) {
  const brut = String(etat.title || 'Séance reprise de l’ancienne régie');
  const h = brut.match(/(\d{1,2})\s*h\s*(\d{2})?\s*(?:à|-|–)\s*(\d{1,2})\s*h\s*(\d{2})?/i);
  const deux = n => String(n).padStart(2, '0');
  return {
    id: uid(), genre: 'atelier',
    titre: brut.replace(/\s*[—–-]\s*\d{1,2}\s*h.*$/i, '').trim() || brut,
    debut: h ? `${deux(h[1])}:${h[2] || '00'}` : '', finH: h ? `${deux(h[3])}:${h[4] || '00'}` : '',
    blocs: etat.phases.map(p => {
      const i = Number(p.instrument) || 0;
      return nb(V14_TYPE[i] || 'parole', String(p.name || 'Temps').slice(0, 80), Math.max(1, Number(p.minutes) || 5), {
        texte: String(p.text || ''), repere: p.cue && p.cue !== '[silence]' ? String(p.cue) : '',
        instrument: V14_INSTR[i] || null, rythme: i === 1 ? 5 : i === 2 ? 8 : null, expire: i === 1 ? 5 : null,
        position: i === 4 ? 'assis' : null,
      });
    }),
  };
}

// Une sauvegarde de l'ancienne régie peut contenir plusieurs séances.
function v14Seances(etat) {
  const liste = Array.isArray(etat.sessions) && etat.sessions.length
    ? etat.sessions.filter(x => x && Array.isArray(x.phases) && x.phases.length).map(x => ({ title: x.title || x.name || 'Séance', phases: x.phases }))
    : (Array.isArray(etat.phases) && etat.phases.length ? [{ title: etat.title, phases: etat.phases }] : []);
  return liste.map(v14Seance);
}
function ajouterSeances(seances, origine) {
  if (!seances.length) { toast('Aucune séance trouvée dans ce fichier'); return }
  const resume = seances.map(s => `• « ${s.titre} » — ${s.blocs.length} temps, ${dureeTxt(total(s))}`).join('\n');
  if (!confirm(`${seances.length} séance${seances.length > 1 ? 's' : ''} ${origine} :\n\n${resume}\n\nLes ajouter à vos séances ?`)) return;
  seances.forEach(s => D.seances.push(s));
  delete D.depart; sauver();
  aller(seances.length === 1 ? 'editer' : 'seances', seances.length === 1 ? seances[0].id : undefined);
  toast(seances.length > 1 ? `${seances.length} séances reprises` : 'Séance reprise de l’ancienne régie');
}
// Fichier de sauvegarde : ancienne régie (phases) ou nouvelle régie (séances).
$('#f-ancienne').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const x = JSON.parse(await f.text());
    if (Array.isArray(x.seances)) {
      const connues = new Set(D.seances.map(s => s.id));
      const neuves = x.seances.filter(s => s && Array.isArray(s.blocs) && !connues.has(s.id));
      return ajouterSeances(neuves, 'dans cette sauvegarde');
    }
    ajouterSeances(v14Seances(x), 'dans ce fichier');
  } catch (err) { toast('Ce fichier n’est pas une sauvegarde de régie') }
};

function fenetreImport() {
  if ($('#voile-import')) return;
  const v = document.createElement('div'); v.className = 'voile'; v.id = 'voile-import';
  v.innerHTML = `<form class="fenetre" id="f-import" autocomplete="off">
    <h2>Reprendre l’ancienne régie</h2>
    <p class="sous" style="margin:0 0 14px">Votre séance de l’ancienne page (« Régie de mon Hêtre ») est protégée par le nom d’espace et le mot de passe que vous aviez choisis. Elle sera <b>recopiée ici</b>, sans rien changer là-bas.</p>
    <label class="champ">Nom d’espace<input type="text" id="im-nom" autocomplete="off"></label>
    <label class="champ">Mot de passe<input type="password" id="im-mdp" autocomplete="off"></label>
    <p class="aide">Votre mot de passe ne quitte pas cet appareil.</p>
    <div class="err cache" id="im-err"></div>
    <p class="aide" style="margin:10px 0 0">Mot de passe perdu ? <button type="button" class="lien" id="im-fichier">Importer un fichier de l’ancienne régie</button></p>
    <div class="actions"><button type="button" class="btn" id="im-annuler">Plus tard</button><button type="submit" class="btn p" id="im-ok">Récupérer ma séance</button></div>
  </form>`;
  document.body.appendChild(v);
  $('#im-annuler').onclick = () => v.remove();
  $('#im-fichier').onclick = () => { v.remove(); $('#f-ancienne').click() };
  v.onclick = e => { if (e.target === v) v.remove() };
  $('#f-import').onsubmit = async e => {
    e.preventDefault();
    const ok = $('#im-ok'), err = $('#im-err');
    ok.disabled = true; ok.textContent = 'Un instant…'; err.classList.add('cache');
    try {
      const etat = await v14Ouvrir($('#im-nom').value, $('#im-mdp').value);
      v.remove();
      ajouterSeances(v14Seances(etat), 'dans votre ancienne régie');
    } catch (x) {
      err.classList.remove('cache');
      err.textContent = x.message === 'espace' ? 'Ce nom d’espace n’existe pas sur l’ancienne régie.'
        : /invalid|401/.test(x.message || '') ? 'Mot de passe incorrect.'
        : x.message === 'vide' ? 'Aucune séance n’est enregistrée dans cet espace.'
        : 'Récupération impossible pour le moment (connexion ?).';
      ok.disabled = false; ok.textContent = 'Récupérer ma séance';
    }
  };
  setTimeout(() => $('#im-nom').focus(), 50);
}
